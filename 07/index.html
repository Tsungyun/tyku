<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自訂除法練習題產生器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 html2pdf.js 以支援 PDF 匯出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        /* 網頁畫面上顯示的直式除法外框樣式 */
        .vertical-math {
            display: inline-block;
            background-color: #f9fafb;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            padding: 1.5rem;
            overflow-x: auto;
            max-width: 100%;
        }

        /* 隱藏區塊，專門用於在背景建構 PDF 排版 */
        #pdf-export-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
        
        <div id="controls-section">
            <h1 class="text-3xl md:text-4xl font-bold text-center mb-2 text-indigo-600 tracking-wide">自訂除法練習題產生器</h1>
            <p class="text-center text-gray-500 mb-8 font-medium">8 題模式 / 支援橫向 A4 對半裁切設計 / 支援各類題型與大小關係指定</p>
            
            <!-- 設定區塊 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- 左側設定：位數與大小關係 -->
                <div class="bg-indigo-50/50 p-5 rounded-xl border border-indigo-100 shadow-sm">
                    <h3 class="font-bold text-indigo-700 mb-4 text-lg border-b border-indigo-200 pb-2">🔢 基本數值與大小關係</h3>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <label class="font-bold text-gray-700">被除數：</label>
                            <select id="dividend-digits" class="border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 p-1.5 w-32 font-medium">
                                <option value="1">1 位數</option><option value="2">2 位數</option>
                                <option value="3" selected>3 位數</option><option value="4">4 位數</option>
                                <option value="5">5 位數</option><option value="6">6 位數</option>
                                <option value="7">7 位數</option><option value="8">8 位數</option>
                                <option value="9">9 位數</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="font-bold text-gray-700">除數：</label>
                            <select id="divisor-digits" class="border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 p-1.5 w-32 font-medium">
                                <option value="1">1 位數</option><option value="2" selected>2 位數</option>
                                <option value="3">3 位數</option><option value="4">4 位數</option>
                                <option value="5">5 位數</option><option value="6">6 位數</option>
                                <option value="7">7 位數</option><option value="8">8 位數</option>
                                <option value="9">9 位數</option>
                            </select>
                        </div>
                        <div class="pt-2 border-t border-indigo-100">
                            <label class="block text-sm font-bold text-gray-700 mb-2">大小關係限制 (老師可自由選擇)：</label>
                            <select id="size-relation" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 text-base font-medium text-indigo-700 bg-white">
                                <option value="gt">被除數 &gt; 除數 (大除小，例：45 ÷ 6)</option>
                                <option value="lt">被除數 &lt; 除數 (小除大，例：3 ÷ 8)</option>
                                <option value="rnd">不限制 (大小隨機出題)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 右側設定：題型與商數設定 -->
                <div class="bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 shadow-sm">
                    <h3 class="font-bold text-emerald-700 mb-4 text-lg border-b border-emerald-200 pb-2">🎯 題型與商數設定</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">請選擇商的計算方式與餘數：</label>
                            <select id="question-type" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-emerald-500 focus:ring-emerald-500 p-2 text-base font-medium text-gray-700 bg-white">
                                <optgroup label="【基本】商算到個位數 (整數)">
                                    <option value="0-zero">商到個位數，整除 (沒有餘數)</option>
                                    <option value="0-has">商到個位數，有餘數</option>
                                    <option value="0-rnd">商到個位數，隨機出題 (整除或有餘數)</option>
                                </optgroup>
                                <optgroup label="【進階】商算到小數第 1 位">
                                    <option value="1-zero">商到小數第 1 位，整除 (沒有餘數)</option>
                                    <option value="1-has">商到小數第 1 位，有餘數</option>
                                    <option value="1-rnd">商到小數第 1 位，隨機出題</option>
                                </optgroup>
                                <optgroup label="【進階】商算到小數第 2 位">
                                    <option value="2-zero">商到小數第 2 位，整除 (沒有餘數)</option>
                                    <option value="2-has">商到小數第 2 位，有餘數</option>
                                    <option value="2-rnd">商到小數第 2 位，隨機出題</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 按鈕區塊 -->
            <div class="flex flex-wrap justify-center gap-4 mb-10 border-t border-gray-200 pt-8">
                <button id="btn-generate" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 text-lg">
                    🎲 產生新題目
                </button>
                <button id="btn-show-answer" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 text-lg">
                    👀 顯示解答
                </button>
                <button id="btn-export-q" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 flex items-center">
                    <span>📄 匯出題目 (PDF)</span>
                </button>
                <button id="btn-export-a" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 flex items-center">
                    <span>📝 匯出解答 (PDF)</span>
                </button>
            </div>
        </div>

        <!-- 網頁上的題目顯示區 -->
        <div id="questions-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- 題目將透過 JavaScript 動態生成 -->
        </div>
    </div>

    <!-- 專屬版權宣告頁尾 -->
    <div class="text-center text-gray-400 text-sm mt-8 mb-4 tracking-wider">
        &copy; 谷宗芸老師設計 / AI 輔助生成
    </div>

    <!-- 虛擬小鍵盤 (預設隱藏) -->
    <div id="virtual-numpad" class="hidden absolute z-50 bg-gray-100 border border-gray-300 shadow-2xl rounded-xl p-2 w-44 transition-opacity">
        <div class="grid grid-cols-3 gap-1">
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="1">1</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="2">2</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="3">3</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="4">4</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="5">5</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="6">6</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="7">7</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="8">8</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="9">9</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val=".">.</button>
            <button class="numpad-btn bg-white hover:bg-indigo-50 text-gray-800 font-bold py-2 rounded shadow-sm text-lg border border-gray-200" data-val="0">0</button>
            <button class="numpad-btn bg-red-100 hover:bg-red-200 text-red-600 font-bold py-2 rounded shadow-sm text-lg border border-red-200" data-val="del">⌫</button>
        </div>
        <button id="numpad-close" class="mt-2 w-full bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-1.5 rounded shadow-sm text-sm transition">關閉鍵盤</button>
    </div>

    <!-- 用於暫存 PDF 排版的隱藏容器 -->
    <div id="pdf-export-container"></div>

    <script>
        // DOM 元素選取
        const questionsContainer = document.getElementById('questions-container');
        const pdfExportContainer = document.getElementById('pdf-export-container');
        
        const btnGenerate = document.getElementById('btn-generate');
        const btnShowAnswer = document.getElementById('btn-show-answer');
        const btnExportQ = document.getElementById('btn-export-q');
        const btnExportA = document.getElementById('btn-export-a');
        
        const dividendSel = document.getElementById('dividend-digits');
        const divisorSel = document.getElementById('divisor-digits');
        const sizeRelationSel = document.getElementById('size-relation');
        const questionTypeSel = document.getElementById('question-type');
        
        let currentQuestions = [];
        let answersShown = false;
        
        // 虛擬鍵盤狀態
        const numpad = document.getElementById('virtual-numpad');
        let activeInput = null;

        // UI 邏輯：防止不合理的數學設定 (自動防呆)
        function updateUIConstraints() {
            let aDig = parseInt(dividendSel.value);
            let bDig = parseInt(divisorSel.value);
            let sizeRelOpts = Array.from(sizeRelationSel.options);

            // 1. 重設大小關係的停用狀態
            sizeRelOpts.forEach(opt => opt.disabled = false);

            // 檢查位數是否已經強制決定了大小關係
            if (aDig > bDig) {
                // 位數較大，被除數必定 > 除數，停用「小除大」
                sizeRelOpts.find(o => o.value === 'lt').disabled = true;
                if (sizeRelationSel.value === 'lt') sizeRelationSel.value = 'gt';
            } else if (aDig < bDig) {
                // 位數較小，被除數必定 < 除數，停用「大除小」
                sizeRelOpts.find(o => o.value === 'gt').disabled = true;
                if (sizeRelationSel.value === 'gt') sizeRelationSel.value = 'lt';
            }

            // 2. 處理題型選項防呆
            let effectiveSizeRel = sizeRelationSel.value;
            if (aDig < bDig) effectiveSizeRel = 'lt'; // 即使選隨機，位數小就是小除大
            
            let qTypeOpts = Array.from(questionTypeSel.options);
            qTypeOpts.forEach(opt => opt.disabled = false);

            // 如果是「小除大 (被除數 < 除數)」，個位數不可能整除 (除非被除數是0，但我們最小是1)
            // 所以停用「商到個位數，整除」選項
            if (effectiveSizeRel === 'lt') {
                let opt0Zero = qTypeOpts.find(o => o.value === '0-zero');
                if (opt0Zero) {
                    opt0Zero.disabled = true;
                    if (questionTypeSel.value === '0-zero') questionTypeSel.value = '0-has';
                }
            }
        }

        // 綁定設定變更事件以觸發防呆機制
        dividendSel.addEventListener('change', updateUIConstraints);
        divisorSel.addEventListener('change', updateUIConstraints);
        sizeRelationSel.addEventListener('change', updateUIConstraints);
        questionTypeSel.addEventListener('change', updateUIConstraints);

        // 產生特定位數的隨機數字串
        function getRandomString(digits) {
            let result = (Math.floor(Math.random() * 9) + 1).toString();
            for (let i = 1; i < digits; i++) {
                result += Math.floor(Math.random() * 10).toString();
            }
            return result;
        }

        // 求最大公因數 (用於整除建構法)
        function gcd(a, b) {
            while (b !== 0n) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        // 產生單一除法題目
        function generateDivisionQuestion(usedNumbers) {
            let A_digits = parseInt(dividendSel.value);
            let B_digits = parseInt(divisorSel.value);
            let sizeRel = sizeRelationSel.value;
            
            // 解析題型與商的設定 (例如 "1-zero" 代表 小數第1位 + 整除)
            let typeParts = questionTypeSel.value.split('-');
            let prec = parseInt(typeParts[0]); // 精確度 (0, 1, 2)
            let remType = typeParts[1];        // 餘數型態 (zero, has, rnd)
            
            let maxAttempts = 50000;
            let attempts = 0;
            let num1, num2;
            
            while (attempts < maxAttempts) {
                attempts++;
                
                if (remType === 'zero') {
                    // 要求整除：採用數學建構法確保 100% 成功，而不依賴純隨機盲測
                    num2 = BigInt(getRandomString(B_digits));
                    let multiplier = 10n ** BigInt(prec);
                    let gcdVal = gcd(num2, multiplier);
                    let requiredFactor = num2 / gcdVal; // A 必須是這個數的倍數
                    
                    let minA = 10n ** BigInt(A_digits - 1);
                    if (A_digits === 1) minA = 1n;
                    let maxA = (10n ** BigInt(A_digits)) - 1n;
                    
                    let minK = minA / requiredFactor + (minA % requiredFactor === 0n ? 0n : 1n);
                    let maxK = maxA / requiredFactor;
                    
                    if (minK > maxK) continue; // 該除數條件下無法構造，重試
                    
                    let range = maxK - minK + 1n;
                    let k = minK + BigInt(Math.floor(Math.random() * Number(range))); 
                    num1 = requiredFactor * k;
                    
                    // 確保不會提早整除 (例如要求小數第2位才整除，不能在小數第1位就整除了)
                    if (prec > 0) {
                        let prevMult = 10n ** BigInt(prec - 1);
                        if ((num1 * prevMult) % num2 === 0n) continue;
                    }
                } else {
                    // 隨機或要求有餘數：用隨機產生後驗證
                    num1 = BigInt(getRandomString(A_digits));
                    num2 = BigInt(getRandomString(B_digits));
                    
                    let mult = 10n ** BigInt(prec);
                    let isZeroRem = ((num1 * mult) % num2 === 0n);
                    
                    if (remType === 'has' && isZeroRem) continue;
                }
                
                // 驗證大小關係 (老師指定的限制)
                if (sizeRel === 'gt' && num1 <= num2) continue;
                if (sizeRel === 'lt' && num1 >= num2) continue;
                
                // 驗證數字獨立性 (避免 8 題內出現完全一樣的組合)
                let pairKey = num1.toString() + "/" + num2.toString();
                if (usedNumbers.has(pairKey)) {
                    // 若條件極端嚴苛，嘗試 4 萬次後放行重複以防無限迴圈當機
                    if (attempts < 40000) continue; 
                }
                
                usedNumbers.add(pairKey);
                return { num1, num2, precision: prec };
            }
            
            // 極端防呆退路 (在合理的設定下不會觸發)
            console.warn("條件過於嚴苛，已退回預設題目");
            let fallbackA = 10n * (10n ** BigInt(prec));
            let fallbackB = 2n;
            return { num1: fallbackA, num2: fallbackB, precision: prec };
        }

        // 產生 8 題測驗
        function generateQuestions() {
            currentQuestions = [];
            let usedNumbers = new Set();
            
            for (let i = 0; i < 8; i++) {
                currentQuestions.push(generateDivisionQuestion(usedNumbers));
            }
            
            answersShown = false;
            renderQuestionsForWeb();
        }

        // 格式化橫式答案 (含餘數顯示)
        function formatAnswer(A, B, P) {
            let mult = 10n ** BigInt(P);
            let dividend = A * mult;
            let q = dividend / B;
            let r = dividend % B;
            
            let qStr = q.toString();
            if (P > 0) {
                qStr = qStr.padStart(P + 1, '0');
                qStr = qStr.slice(0, -P) + "." + qStr.slice(-P);
            }
            
            if (r === 0n) return qStr;
            
            let rStr = r.toString();
            if (P > 0) {
                rStr = rStr.padStart(P + 1, '0');
                rStr = "0." + rStr.slice(-P); // 確保餘數小數點位置正確
            }
            
            return `${qStr} ... ${rStr}`;
        }

        // 產生精準對齊的直式除法 HTML
        function generateVerticalDivisionHTML(q, isCompact = false) {
            let A = q.num1;
            let B = q.num2;
            let P = q.precision;
            
            let dividendStr = A.toString();
            let divisorStr = B.toString();
            if (P > 0) dividendStr += "." + "0".repeat(P);
            
            let dividendDigits = dividendStr.replace(".", "").split("");
            let b = BigInt(B);
            
            let quotientStr = "";
            let stepRows = [];
            let current = 0n;
            
            let decIndex = dividendStr.indexOf(".");
            if (decIndex === -1) decIndex = dividendStr.length;
            
            let offset = divisorStr.length + 3; // 除數長度 + " ) " 長度
            let totalCols = offset + dividendStr.length; // 總格數
            
            let firstStep = true;
            
            // 模擬直式計算步驟
            for (let i = 0; i < dividendDigits.length; i++) {
                current = current * 10n + BigInt(dividendDigits[i]);
                let qDigit = current / b;
                quotientStr += qDigit.toString();
                let sub = qDigit * b;
                
                // 只有在商數大於 0 或已經是最後一步時才顯示減法過程
                if (qDigit > 0n || (i === dividendDigits.length - 1 && current > 0n && firstStep)) {
                    let offsetIdx = i;
                    if (P > 0 && i >= decIndex) offsetIdx++; // 越過小數點，索引向右偏移
                    
                    if (!firstStep) {
                        stepRows.push({ text: current.toString(), endIdx: offsetIdx, border: false });
                    }
                    stepRows.push({ text: sub.toString(), endIdx: offsetIdx, border: true });
                    
                    current = current - sub;
                    firstStep = false;
                }
            }
            
            let finalRemOffset = dividendDigits.length - 1;
            if (P > 0) finalRemOffset++;
            stepRows.push({ text: current.toString(), endIdx: finalRemOffset, border: false, color: '#2563eb' });
            
            // 處理商數 (補零與小數點)
            let finalQ = quotientStr.substring(0, decIndex) + (P > 0 ? "." + quotientStr.substring(decIndex) : "");
            finalQ = finalQ.replace(/^0+(?=\d)/, "");
            if (finalQ.startsWith(".")) finalQ = "0" + finalQ;
            
            // 設定視覺參數
            let fontSize = isCompact ? "13px" : "18px";
            let html = `<div style="font-family: 'Courier New', Courier, monospace; font-size: ${fontSize}; line-height: 1.3; display: flex; flex-direction: column; align-items: flex-start; letter-spacing: 0.1em;">`;
            
            // 輔助函式：建立精準對齊的每一行字串
            function buildLine(valStr, endIdx, hasBorder) {
                let chars = Array(totalCols).fill('&nbsp;');
                let currCol = offset + endIdx;
                for (let i = valStr.length - 1; i >= 0; i--) {
                    if (currCol === offset + decIndex) currCol--; // 跳過小數點的直欄
                    chars[currCol] = valStr[i];
                    currCol--;
                }
                
                if (hasBorder) {
                    let startCol = currCol + 1;
                    let before = chars.slice(0, startCol).join('');
                    let bordered = chars.slice(startCol, offset + endIdx + 1).join('');
                    let after = chars.slice(offset + endIdx + 1).join('');
                    return `<div>${before}<span style="border-bottom: 2px solid #374151;">${bordered}</span>${after}</div>`;
                } else {
                    return `<div>${chars.join('')}</div>`;
                }
            }
            
            // 1. 商數列
            let qChars = Array(totalCols).fill('&nbsp;');
            let qIndex = offset + decIndex - 1; 
            let intPart = finalQ.split('.')[0];
            for(let i=intPart.length-1; i>=0; i--) qChars[qIndex--] = intPart[i];
            
            if (finalQ.includes('.')) {
                qChars[offset + decIndex] = '.';
                let decPart = finalQ.split('.')[1];
                let decIdx = offset + decIndex + 1;
                for(let i=0; i<decPart.length; i++) qChars[decIdx++] = decPart[i];
            }
            html += `<div>${qChars.join('')}</div>`;
            
            // 2. 除數與被除數列
            let divRow = Array(totalCols).fill('&nbsp;');
            for(let i=0; i<divisorStr.length; i++) divRow[i] = divisorStr[i];
            divRow[divisorStr.length + 1] = ')';
            
            let divBefore = divRow.slice(0, offset).join('');
            let divStrSpan = `<span style="border-top: 2px solid #374151; padding-top: 1px;">${dividendStr.split('').join('')}</span>`;
            html += `<div>${divBefore}${divStrSpan}</div>`;
            
            // 3. 減法步驟與餘數
            stepRows.forEach(row => {
                 if (row.color) { // 最終餘數，處理小數點自然落下的效果
                     let chars = Array(totalCols).fill('&nbsp;');
                     let currCol = offset + row.endIdx;
                     for (let i = row.text.length - 1; i >= 0; i--) {
                         if (currCol === offset + decIndex) currCol--;
                         chars[currCol] = row.text[i];
                         currCol--;
                     }
                     if (P > 0 && current !== 0n) {
                         chars[offset + decIndex] = '.';
                         chars[offset + decIndex - 1] = '0';
                     }
                     html += `<div style="color: ${row.color}; font-weight: bold;">${chars.join('')}</div>`;
                 } else {
                     html += buildLine(row.text, row.endIdx, row.border);
                 }
            });
            
            html += `</div>`;
            return html;
        }

        // 渲染網頁畫面上的題目
        function renderQuestionsForWeb() {
            questionsContainer.innerHTML = ''; 
            
            // 取得目前的題型設定，判斷是否需要餘數輸入框
            let typeParts = questionTypeSel.value.split('-');
            let needsRem = typeParts[1] !== 'zero';

            currentQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white border-2 border-gray-100 p-5 rounded-xl shadow-sm hover:shadow-md transition-shadow flex flex-col h-full';

                const header = document.createElement('div');
                header.className = 'text-lg font-semibold text-gray-700 mb-4 border-b-2 border-gray-50 pb-2';
                
                let displayAns = answersShown ? formatAnswer(q.num1, q.num2, q.precision) : '';
                
                if (answersShown) {
                    // 解答模式下，直接顯示答案字串
                    header.innerHTML = `<span class="text-indigo-500 mr-2 text-xl">(${index + 1})</span> ${q.num1.toString()} &divide; ${q.num2.toString()} = <span class="text-blue-600 font-bold ml-1">${displayAns}</span>`;
                } else {
                    // 題目模式下，顯示學生作答區
                    header.innerHTML = `
                        <div class="mb-3 truncate"><span class="text-indigo-500 mr-2 text-xl">(${index + 1})</span> ${q.num1.toString()} &divide; ${q.num2.toString()} = </div>
                        <div class="flex items-center gap-1.5 mt-2 text-sm bg-indigo-50/40 p-2 rounded-lg border border-indigo-100">
                            <label class="font-bold text-gray-600 whitespace-nowrap">商:</label>
                            <input type="text" readonly class="student-ans-q w-14 border border-gray-300 rounded p-1 text-center bg-white cursor-pointer focus:ring-2 focus:ring-indigo-400 focus:outline-none shadow-inner text-base font-bold text-indigo-700" data-qidx="${index}" placeholder="?">
                            
                            ${needsRem ? `<label class="font-bold text-gray-600 whitespace-nowrap ml-1">餘:</label>
                            <input type="text" readonly class="student-ans-r w-14 border border-gray-300 rounded p-1 text-center bg-white cursor-pointer focus:ring-2 focus:ring-indigo-400 focus:outline-none shadow-inner text-base font-bold text-emerald-700" data-qidx="${index}" placeholder="?">` : ''}
                            
                            <button class="check-ans-btn bg-emerald-500 text-white px-2 py-1.5 rounded shadow-sm hover:bg-emerald-600 ml-auto whitespace-nowrap transition transform hover:scale-105 active:scale-95" data-qidx="${index}">對答案</button>
                            <span class="feedback-icon text-xl w-6 text-center" id="feedback-${index}"></span>
                        </div>
                    `;
                }
                card.appendChild(header);

                const answerDiv = document.createElement('div');
                answerDiv.className = `mt-auto flex justify-center py-2 ${answersShown ? '' : 'hidden'}`;
                const innerBox = document.createElement('div');
                innerBox.className = 'vertical-math shadow-inner';
                innerBox.innerHTML = generateVerticalDivisionHTML(q, false);
                answerDiv.appendChild(innerBox);
                card.appendChild(answerDiv);
                
                questionsContainer.appendChild(card);
            });
            
            btnShowAnswer.innerHTML = answersShown ? "🙈 隱藏解答" : "👀 顯示解答";
            if(answersShown) {
                btnShowAnswer.className = "bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 text-lg";
            } else {
                btnShowAnswer.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 transform hover:-translate-y-0.5 text-lg";
            }
        }

        // --- 虛擬鍵盤與對答案邏輯 ---

        // 點擊事件代理：顯示鍵盤或對答案
        document.addEventListener('click', (e) => {
            // 點擊作答框顯示鍵盤
            if (e.target.matches('input.student-ans-q, input.student-ans-r')) {
                // 移除之前的 focus 樣式
                if (activeInput) activeInput.classList.remove('ring-2', 'ring-indigo-400');
                
                activeInput = e.target;
                activeInput.classList.add('ring-2', 'ring-indigo-400'); // 加入發光效果提示
                
                // 定位鍵盤到輸入框正下方
                const rect = activeInput.getBoundingClientRect();
                numpad.style.left = `${rect.left + window.scrollX - 20}px`;
                numpad.style.top = `${rect.bottom + window.scrollY + 8}px`;
                numpad.classList.remove('hidden');
            } 
            // 點擊到小鍵盤外部時隱藏鍵盤 (不包含小鍵盤本身或輸入框)
            else if (!numpad.contains(e.target) && e.target.id !== 'virtual-numpad' && !e.target.matches('.check-ans-btn')) {
                numpad.classList.add('hidden');
                if (activeInput) activeInput.classList.remove('ring-2', 'ring-indigo-400');
                activeInput = null;
            }

            // 點擊對答案按鈕
            if (e.target.matches('.check-ans-btn')) {
                let idx = parseInt(e.target.dataset.qidx);
                checkStudentAnswer(idx);
            }
        });

        // 防止點擊小鍵盤時觸發 document 的點擊事件而關閉
        numpad.addEventListener('click', e => e.stopPropagation());

        // 小鍵盤按鈕輸入邏輯
        document.querySelectorAll('.numpad-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!activeInput) return;
                const val = btn.dataset.val;
                if (val === 'del') {
                    activeInput.value = activeInput.value.slice(0, -1);
                } else {
                    activeInput.value += val;
                }
            });
        });

        // 小鍵盤手動關閉按鈕
        document.getElementById('numpad-close').addEventListener('click', (e) => {
            e.stopPropagation();
            numpad.classList.add('hidden');
            if (activeInput) activeInput.classList.remove('ring-2', 'ring-indigo-400');
            activeInput = null;
        });

        // 檢查單題答案邏輯
        function checkStudentAnswer(idx) {
            let q = currentQuestions[idx];
            let p = q.precision;
            
            // 計算正確答案數值
            let mult = 10n ** BigInt(p);
            let dividend = q.num1 * mult;
            let correctQ = dividend / q.num2;
            let correctR = dividend % q.num2;
            
            // 建立標準的字串比對基準 (包含小數點與補零邏輯)
            let expectedQStr = correctQ.toString();
            if (p > 0) {
                expectedQStr = expectedQStr.padStart(p + 1, '0');
                expectedQStr = expectedQStr.slice(0, -p) + "." + expectedQStr.slice(-p);
            }
            
            let expectedRStr = correctR.toString();
            if (p > 0 && correctR !== 0n) {
                expectedRStr = expectedRStr.padStart(p + 1, '0');
                expectedRStr = "0." + expectedRStr.slice(-p);
            } else if (correctR === 0n) {
                expectedRStr = "0";
            }
            
            // 取得學生的輸入值
            let qInput = document.querySelector(`.student-ans-q[data-qidx="${idx}"]`);
            let rInput = document.querySelector(`.student-ans-r[data-qidx="${idx}"]`);
            let feedback = document.getElementById(`feedback-${idx}`);
            
            if (!qInput.value.trim()) {
                feedback.innerHTML = '❓';
                return;
            }

            // 將使用者輸入與正確答案轉為 Number 做比較 (防止 003 == 3 這種被判錯)
            let isQCorrect = Number(qInput.value) === Number(expectedQStr);
            let isRCorrect = true;
            
            // 如果這題有餘數輸入框，就要順便檢查餘數
            if (rInput) {
                let rVal = rInput.value.trim() === "" ? 0 : Number(rInput.value);
                isRCorrect = (rVal === Number(expectedRStr));
            }
            
            if (isQCorrect && isRCorrect) {
                feedback.innerHTML = '✅';
                feedback.className = "feedback-icon text-xl w-6 text-center font-bold text-emerald-500 animate-bounce";
            } else {
                feedback.innerHTML = '❌';
                feedback.className = "feedback-icon text-xl w-6 text-center font-bold text-red-500";
            }
        }
        
        // 動態建構供 PDF 匯出的特殊排版 (A4 橫向、左右對稱雙欄)
        function buildPDFLayout(isAnswerMode) {
            const container = document.createElement('div');
            container.style.width = '1123px';
            container.style.height = '794px';
            container.style.backgroundColor = 'white';
            container.style.display = 'flex';
            container.style.flexDirection = 'row';
            container.style.padding = '25px 15px'; 
            container.style.boxSizing = 'border-box';

            let titleText = '除法練習題' + (isAnswerMode ? ' (解答卷)' : ' (題目卷)');

            const buildHalfPage = () => {
                const half = document.createElement('div');
                half.style.width = '50%';
                half.style.height = '100%';
                half.style.display = 'flex';
                half.style.flexDirection = 'column';
                half.style.padding = '0 30px';
                half.style.boxSizing = 'border-box';

                const title = document.createElement('h2');
                title.style.textAlign = 'center';
                title.style.fontSize = '26px';
                title.style.fontWeight = 'bold';
                title.style.marginBottom = '25px';
                title.style.color = '#1f2937';
                title.style.letterSpacing = '2px';
                title.innerText = titleText;
                half.appendChild(title);

                const grid = document.createElement('div');
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = '1fr 1fr'; 
                grid.style.gridTemplateRows = 'repeat(4, 1fr)'; 
                grid.style.gap = '20px 15px'; 
                grid.style.flexGrow = '1'; 

                currentQuestions.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.style.border = '2px solid #e5e7eb';
                    card.style.borderRadius = '10px';
                    card.style.padding = '12px 15px';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';

                    const header = document.createElement('div');
                    header.style.fontSize = '16px';
                    header.style.fontWeight = 'bold';
                    header.style.borderBottom = '1.5px solid #f3f4f6';
                    header.style.paddingBottom = '8px';
                    header.style.marginBottom = '12px';
                    
                    let answerStr = isAnswerMode ? formatAnswer(q.num1, q.num2, q.precision) : '';
                    header.innerHTML = `<span style="color: #6366f1; margin-right: 6px; font-size: 18px;">(${index + 1})</span> ${q.num1.toString()} &divide; ${q.num2.toString()} = <span style="color: #2563eb; margin-left: 2px;">${answerStr}</span>`;
                    card.appendChild(header);

                    if (isAnswerMode) {
                        const answerDiv = document.createElement('div');
                        answerDiv.style.display = 'flex';
                        answerDiv.style.justifyContent = 'center';
                        answerDiv.style.alignItems = 'center';
                        answerDiv.style.flexGrow = '1';
                        answerDiv.innerHTML = generateVerticalDivisionHTML(q, true);
                        card.appendChild(answerDiv);
                    }

                    grid.appendChild(card);
                });

                half.appendChild(grid);
                return half;
            };

            const leftHalf = buildHalfPage();
            const rightHalf = buildHalfPage();
            rightHalf.style.borderLeft = '2px dashed #9ca3af';

            container.appendChild(leftHalf);
            container.appendChild(rightHalf);

            return container;
        }

        function exportToPDF(isAnswerMode) {
            const btn = isAnswerMode ? btnExportA : btnExportQ;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse">⏳ 產生PDF中...</span>`;
            btn.disabled = true;

            pdfExportContainer.innerHTML = '';
            const layout = buildPDFLayout(isAnswerMode);
            pdfExportContainer.appendChild(layout);

            const opt = {
                margin:       0, 
                filename:     isAnswerMode ? '除法練習題_解答版.pdf' : '除法練習題_題目版.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'px', format: [1123, 794], orientation: 'landscape' } 
            };

            setTimeout(() => {
                html2pdf().set(opt).from(layout).save().then(() => {
                    pdfExportContainer.innerHTML = '';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }).catch(err => {
                    console.error("PDF Generate Error", err);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    // 使用網頁渲染提示代替系統 alert
                    alert("匯出 PDF 時發生錯誤，請重試。"); 
                });
            }, 300);
        }

        // 綁定事件
        btnGenerate.addEventListener('click', generateQuestions);
        
        btnShowAnswer.addEventListener('click', () => {
            answersShown = !answersShown;
            renderQuestionsForWeb();
        });

        btnExportQ.addEventListener('click', () => exportToPDF(false));
        btnExportA.addEventListener('click', () => exportToPDF(true));

        // 初始執行一次
        window.onload = () => {
            updateUIConstraints();
            generateQuestions();
        };
    </script>
</body>
</html>
