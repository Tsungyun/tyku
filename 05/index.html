<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學應用題產生器</title>
    <!-- 引入 Tailwind CSS 用於快速版面設計與樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 html2pdf.js 函式庫用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- 自訂額外樣式 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        /* 隱藏列印時不需要的元素 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white;
            }
            #printable-area-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                background: none !important;
            }
        }

        /* 直式計算樣式 */
        .vertical-math {
            font-family: monospace;
            display: inline-block;
            text-align: right;
            line-height: 1.1;
            font-size: 1rem;
        }
        .vertical-math .underline {
            border-bottom: 1px solid #374151;
            margin-bottom: 2px;
            padding-bottom: 2px;
        }
        
        /* 網頁預覽模式 */
        .screen-view {
            width: 100%;
            max-width: 900px;
            background: white;
            margin: 0 auto;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        .screen-view .student-info { display: none !important; } /* 網頁預覽時隱藏班級姓名 */
        .screen-view .two-column-layout {
            padding: 20px;
            display: block;
        }
        .screen-view .half-page {
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .screen-view #right-half {
            display: none !important; /* 網頁上隱藏右側的複製卷 */
        }

        /* 匯出 PDF 模式 (A4 橫向雙欄) */
        .pdf-mode {
            width: 297mm !important;
            height: 209mm !important; /* 設定 209mm 避免剛好 210mm 觸發某些閱讀器的第二頁 */
            background: white !important;
            margin: 0 !important;
            position: relative;
            box-sizing: border-box;
            border-radius: 0 !important;
            max-width: none !important;
            overflow: hidden; /* 絕對禁止溢出產生新頁面 */
        }
        .pdf-mode .two-column-layout {
            display: flex !important;
            flex-direction: row !important;
            width: 100%;
            height: 100%;
            padding: 8mm 10mm !important;
            gap: 12mm !important;
        }
        .pdf-mode .half-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: none;
            padding: 0;
            background-color: #fff;
            height: 100%;
        }
        .pdf-mode #right-half {
            display: flex !important;
        }
        .pdf-mode .no-print {
            display: none !important;
        }

        /* PDF 模式下的字型與間距微調 */
        .pdf-mode .text-sm { font-size: 0.8rem !important; line-height: 1.4 !important; }
        .pdf-mode .question-container { padding: 4px 6px !important; margin-bottom: 2px !important; }
        
        /* 若為解答卷，隱藏讓學生計算的空白區域並壓縮空間，確保解答塞得下 */
        .pdf-mode.is-answer-sheet .calc-space { display: none !important; }
        .pdf-mode.is-answer-sheet .question-container { 
            justify-content: flex-start !important; 
            padding: 2px 4px !important;
            margin-bottom: 0 !important;
        }
        .pdf-mode.is-answer-sheet .answer-content { 
            margin-top: 2px !important; 
            padding: 2px !important;
        }

        /* 針對解答卷強制縮小字體與間距，確保第7、8題不會被裁切 */
        .pdf-mode.is-answer-sheet .gap-y-2 { gap: 2px !important; }
        .pdf-mode.is-answer-sheet p { font-size: 0.75rem !important; line-height: 1.2 !important; }
        .pdf-mode.is-answer-sheet .text-sm { font-size: 0.75rem !important; }
        .pdf-mode.is-answer-sheet .answer-content .text-sm { font-size: 0.7rem !important; margin-bottom: 2px !important; }
        .pdf-mode.is-answer-sheet .vertical-math { font-size: 0.75rem !important; line-height: 1.0 !important; }
        .pdf-mode.is-answer-sheet .text-xs { font-size: 0.65rem !important; }
        .pdf-mode.is-answer-sheet .mb-3 { margin-bottom: 4px !important; }
        .pdf-mode.is-answer-sheet .pb-1 { padding-bottom: 2px !important; }

        /* 解答區域的過渡動畫 (僅限網頁預覽時) */
        .answer-content {
            display: none;
        }
        .answer-content.show {
            display: block;
        }

        /* 匯出 PDF 或列印時：強制將解答區轉換為「白底黑字」以節省墨水 */
        @media print {
            .answer-content {
                background-color: #ffffff !important;
                border-color: #9ca3af !important; /* 灰框 */
                color: #1f2937 !important; /* 黑灰字 */
            }
            .answer-content .border-l { border-color: #d1d5db !important; }
            .answer-content .text-red-600 { color: #4b5563 !important; }
        }
        .pdf-mode .answer-content {
            background-color: #ffffff !important;
            border-color: #9ca3af !important;
            color: #1f2937 !important;
        }
        .pdf-mode .answer-content .border-l { border-color: #d1d5db !important; }
        .pdf-mode .answer-content .text-red-600 { color: #4b5563 !important; }
    </style>
</head>
<body class="min-h-screen p-2 md:p-4 flex flex-col items-center">

    <!-- 控制面板 -->
    <div class="no-print bg-white rounded-xl shadow-sm p-3 mb-6 w-full max-w-5xl border-t-4 border-blue-500 overflow-x-auto">
        <div class="flex flex-row gap-3 items-center justify-between min-w-max">
            <!-- 題型選擇 -->
            <div class="flex items-center gap-2">
                <label for="difficulty" class="font-medium text-gray-700 text-sm whitespace-nowrap">選擇題型：</label>
                <select id="difficulty" class="form-select block w-full pl-2 pr-8 py-1.5 text-sm border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 rounded-md border shadow-sm">
                    <option value="3x2">三位數 × 兩位數</option>
                    <option value="3x3">三位數 × 三位數</option>
                </select>
            </div>
            
            <!-- 按鈕群組 (強制單一列) -->
            <div class="flex flex-row gap-2 items-center">
                <!-- 產生題目 -->
                <button onclick="generateQuestions()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1.5 px-3 rounded shadow-sm transition-colors duration-200 flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                    </svg>
                    產生新題目
                </button>
                
                <!-- 網頁解答開關 -->
                <button onclick="toggleAllAnswers()" id="toggle-ans-btn" class="bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium py-1.5 px-3 rounded shadow-sm transition-colors duration-200 flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                    </svg>
                    顯示網頁解答
                </button>

                <!-- 直接將匯出按鈕拆分為兩個獨立按鈕，解決下拉選單難按的問題 -->
                <button onclick="exportPDF(false)" class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-1.5 px-3 rounded shadow-sm transition-colors duration-200 flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    匯出題目卷
                </button>

                <button onclick="exportPDF(true)" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-1.5 px-3 rounded shadow-sm transition-colors duration-200 flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    匯出解答卷
                </button>
            </div>
        </div>
    </div>

    <!-- 可列印區域 -->
    <div id="printable-area-wrapper" class="w-full flex justify-center px-2 pb-10">
        <div id="printable-content" class="screen-view shadow-xl border border-gray-200">
            <div class="two-column-layout">
                
                <!-- 左半部 (第一份試卷) -->
                <div class="half-page" id="left-half">
                    <!-- 精簡的標題列：只留必要資訊 -->
                    <div class="flex justify-between items-end mb-3 border-b-2 border-gray-600 pb-1">
                        <div class="font-bold text-lg text-gray-800 paper-title tracking-widest">練習卷</div>
                        <div class="student-info flex gap-4 text-sm text-gray-800">
                            <span>班級：＿＿＿＿</span>
                            <span>姓名：＿＿＿＿＿＿</span>
                            <span>得分：＿＿＿</span>
                        </div>
                    </div>
                    <!-- 題目容器 -->
                    <div id="questions-grid-left" class="grid grid-cols-2 grid-rows-4 gap-x-4 gap-y-2 flex-grow text-sm"></div>
                </div>

                <!-- 右半部 (第二份試卷，內容與左半部相同) -->
                <div class="half-page" id="right-half">
                    <!-- 精簡的標題列 -->
                    <div class="flex justify-between items-end mb-3 border-b-2 border-gray-600 pb-1">
                        <div class="font-bold text-lg text-gray-800 paper-title tracking-widest">練習卷</div>
                        <div class="student-info flex gap-4 text-sm text-gray-800">
                            <span>班級：＿＿＿＿</span>
                            <span>姓名：＿＿＿＿＿＿</span>
                            <span>得分：＿＿＿</span>
                        </div>
                    </div>
                    <!-- 題目容器 -->
                    <div id="questions-grid-right" class="grid grid-cols-2 grid-rows-4 gap-x-4 gap-y-2 flex-grow text-sm"></div>
                </div>
                
            </div>
        </div>
    </div>

<!-- 專屬版權宣告頁尾 (乾淨、單行設計) -->
    <div class="text-center text-gray-400 text-sm mt-8 mb-4 tracking-wider">
        &copy; 谷宗芸老師設計 / AI 輔助生成
    </div>

    
    <script>
        // 題庫擴充至 40 題，包含各種不同的情境、句型與長短變化。
        // 注意：為了符合中年級數學觀念，{n1} 永遠代表被乘數 (單位與所求答案相同)。
        const templates = [
            // 日常與購物
            { text: "大賣場進貨了 {n2} 箱蘋果，已知每箱蘋果有 {n1} 顆。請問這次賣場總共進了多少顆蘋果？", unit: "顆" },
            { text: "媽媽到百貨公司幫全家人買了 {n2} 件同款的保暖外套。如果一件外套售價是 {n1} 元，她一共花了多少元？", unit: "元" },
            { text: "一箱頂級礦泉水容量為 {n1} 毫升。便利商店的倉庫裡堆放了 {n2} 箱，這些礦泉水總共有幾毫升？", unit: "毫升" },
            { text: "爸爸每天開車通勤，一個月大約會消耗 {n1} 元的汽油。如果連續開車 {n2} 個月，加油的總花費會是多少元？", unit: "元" },
            { text: "社區團購了 {n2} 盒頂級巧克力，每一盒裡面裝有 {n1} 顆。請問鄰居們總共買了幾顆巧克力？", unit: "顆" },
            
            // 學校與教育
            { text: "圖書館的兒童閱覽區有 {n2} 個大書架，每個書架可以擺放 {n1} 本故事書。全部擺滿時，可以放幾本故事書？", unit: "本" },
            { text: "學校舉辦園遊會，共有 {n2} 個班級參與。如果學校發給每個班級 {n1} 張點數券，總共發出了幾張？", unit: "張" },
            { text: "自然老師準備了實驗材料，每個小組發放 {n1} 公克的綠豆。全年級有 {n2} 個小組，老師一共準備了多少公克？", unit: "公克" },
            { text: "一本國語字典有 {n1} 頁。開學時，書商送來了 {n2} 本全新的字典給學校，這些字典全部加起來有幾頁？", unit: "頁" },
            { text: "校慶活動要排字，每個方陣需要 {n1} 位學生。操場上總共排了 {n2} 個方陣，請問參與排字的學生總共有幾位？", unit: "位" },

            // 生產與工廠
            { text: "某間電子零件廠，一台機器每小時可以壓製 {n1} 個精密齒輪。如果機器連續運轉了 {n2} 小時，總共能壓製幾個齒輪？", unit: "個" },
            { text: "口罩工廠接獲急單，產線每天能製造 {n1} 盒口罩。在不休息的情況下連續趕工 {n2} 天，一共生產了幾盒？", unit: "盒" },
            { text: "一家知名烘焙坊，師傅每天要烤出 {n1} 塊鳳梨酥。照這樣計算，他們營業 {n2} 天總共會烤出幾塊？", unit: "塊" },
            { text: "汽車製造廠組裝一台房車需要用到 {n1} 顆特殊螺絲。這個月工廠的目標是組裝 {n2} 台房車，共需要準備幾顆螺絲？", unit: "顆" },
            { text: "紡織廠的一綑布料長度為 {n1} 公尺。服裝公司向他們訂購了 {n2} 綑相同的布料，請問這批布料總長是多少公尺？", unit: "公尺" },

            // 奇幻與遊戲
            { text: "在奇幻遊戲中，打敗一隻史萊姆可以獲得 {n1} 枚金幣。勇者隊伍在迷宮裡一共擊敗了 {n2} 隻史萊姆，他們賺取了多少枚金幣？", unit: "枚" },
            { text: "魔法學院的藥水學測驗，每熬製一瓶隱形藥水需要 {n1} 滴星光露水。學生們總共要熬製 {n2} 瓶，一共需要幾滴星光露水？", unit: "滴" },
            { text: "傳說中的巨龍每次呼吸會吐出 {n1} 顆火星。在與騎士戰鬥的過程中，巨龍吐息了 {n2} 次，總共噴出了幾顆火星？", unit: "顆" },
            { text: "太空探險隊發現了一種能量礦石，每塊礦石含有 {n1} 點能量。他們在星球上採集了 {n2} 塊，總共收集到幾點能量？", unit: "點" },
            { text: "巫師的圖書館裡存放著大量的魔法卷軸，每個大木箱裡裝有 {n1} 卷。地窖裡共有 {n2} 個大木箱，請問總共有幾個魔法卷軸？", unit: "卷" },

            // 交通與旅行
            { text: "一列觀光火車，每節車廂滿載時可以乘坐 {n1} 人。這列火車編組了 {n2} 節車廂，客滿時總共可以載運幾人？", unit: "人" },
            { text: "航空公司的一架波音客機，單趟航程大約會消耗 {n1} 公升的航空燃油。如果這個月飛了 {n2} 趟相同的航線，總共消耗多少公升？", unit: "公升" },
            { text: "高速公路的過路費，每輛遊覽車要繳交 {n1} 元。今天上午共有 {n2} 輛遊覽車通過收費站，收費站共收了多少元？", unit: "元" },
            { text: "一艘豪華郵輪為旅客準備餐點，每天需要消耗 {n1} 公斤的新鮮蔬菜。這趟航程總共 {n2} 天，共消耗了多少公斤的蔬菜？", unit: "公斤" },
            { text: "貨運公司的卡車，每次出車最多可以裝載 {n1} 件包裹。在購物節期間，司機總共出車了 {n2} 趟，最多載運了幾件包裹？", unit: "件" },

            // 自然與生態
            { text: "果農在山坡上種植水蜜桃，每排種了 {n1} 棵果樹。整片果園一共規劃了 {n2} 排，請問總共種了幾棵水蜜桃樹？", unit: "棵" },
            { text: "保育人員在沙灘上發現海龜產卵，平均每個海龜窩裡有 {n1} 顆龜卵。這個繁殖季共記錄到 {n2} 個窩，大約有幾顆海龜卵？", unit: "顆" },
            { text: "一片健康的森林，平均每公頃可以吸收 {n1} 公斤的二氧化碳。這座國家公園面積有 {n2} 公頃，一共能吸收多少公斤？", unit: "公斤" },
            { text: "養蜂場裡的一個蜂箱，每年大約可以採收 {n1} 毫升的特級蜂蜜。蜂農今年管理了 {n2} 個蜂箱，總共可以採收幾毫升？", unit: "毫升" },
            { text: "植物園的志工在培育新品種花卉，每個花盆裡播下了 {n1} 粒種子。溫室裡總共擺放了 {n2} 個花盆，共播下幾粒種子？", unit: "粒" },

            // 建設與工程
            { text: "建築工地在鋪設地磚，每坪面積需要用到 {n1} 塊磁磚。這棟大樓的公共空間總共有 {n2} 坪，一共需要準備幾塊磁磚？", unit: "塊" },
            { text: "工人們在馬路旁安裝路燈，每公里的路段需要安裝 {n1} 盞。這條新建的快速道路長達 {n2} 公里，總共要安裝幾盞路燈？", unit: "盞" },
            { text: "一根大型鋼筋的重量是 {n1} 公斤。建造這座橋樑的橋墩，工程師計算後發現需要 {n2} 根鋼筋，請問這些鋼筋總重幾公斤？", unit: "公斤" },
            { text: "油漆工粉刷牆面，每粉刷一間教室需要花費 {n1} 元的材料費。學校趁暑假翻新了 {n2} 間教室，材料費總共是多少元？", unit: "元" },
            { text: "自來水管線更新工程，每替換一段水管需要 {n1} 分鐘。施工團隊這個月完成了 {n2} 段管線的替換，總共花了多少分鐘？", unit: "分鐘" },

            // 變化句型 (主詞在後、條件先決)
            { text: "為了舉辦跨年演唱會，主辦單位準備了 {n2} 箱螢光棒。已知每一箱裡面剛好裝有 {n1} 支。請問這次一共準備了幾支螢光棒？", unit: "支" },
            { text: "經過長達 {n2} 天的觀察，天文學家發現一顆彗星每天會移動 {n1} 萬公里。請問這段觀察期間內，彗星總共移動了多少萬公里？", unit: "萬公里" },
            { text: "農場裡飼養了許多乳牛。如果一頭健康的乳牛一年可以生產 {n1} 公升的牛奶，那麼 {n2} 頭乳牛一年總共能生產多少公升？", unit: "公升" },
            { text: "共有 {n2} 位善心人士參與了這次的募款活動。假設每個人都固定捐款了 {n1} 元，請問最後主辦單位總共募得多少元？", unit: "元" },
            { text: "倉庫裡堆滿了飼料袋，總共有 {n2} 袋。老闆說每袋飼料的重量都是 {n1} 公克，請幫老闆算算看，全部的飼料加起來有幾公克？", unit: "公克" }
        ];

        let allAnswersVisible = false;
        let currentQuestionsData = [];

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Fisher-Yates 陣列洗牌
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function generateQuestions() {
            const difficulty = document.getElementById('difficulty').value;
            currentQuestionsData = [];

            // 隨機抽選 8 題不重複的情境
            const selectedTemplates = shuffleArray([...templates]).slice(0, 8);

            selectedTemplates.forEach((templateObj, index) => {
                let n1 = getRandomInt(100, 999); // 被乘數永遠是三位數
                let n2 = difficulty === '3x2' ? getRandomInt(10, 99) : getRandomInt(100, 999);
                let is3x2 = difficulty === '3x2';
                
                const answer = n1 * n2;
                
                // 替換佔位符，並將數字加粗標示
                const questionText = templateObj.text
                    .replace('{n1}', `<span class="font-bold">${n1}</span>`)
                    .replace('{n2}', `<span class="font-bold">${n2}</span>`);
                
                const horizontalCalc = `${n1} × ${n2} = ${formatNumber(answer)}`;
                
                // 動態生成 HTML 直式排版
                let verticalCalcHTML = '';
                const n1Str = n1.toString();
                const n2Str = n2.toString();
                
                if (is3x2) {
                    const p1 = n1 * parseInt(n2Str[1]); 
                    const p2 = n1 * parseInt(n2Str[0]); 
                    
                    verticalCalcHTML = `
                        <div class="vertical-math text-sm">
                            <div>${n1Str}</div>
                            <div class="flex justify-between border-b border-gray-700 pb-[2px] mb-[2px]">
                                <span class="mr-2">×</span><span>${n2Str}</span>
                            </div>
                            <div>${p1}</div>
                            <div class="border-b border-gray-700 pb-[2px] mb-[2px]">
                                ${p2}<span class="invisible">0</span>
                            </div>
                            <div>${answer}</div>
                        </div>
                    `;
                } else {
                    const p1 = n1 * parseInt(n2Str[2]); 
                    const p2 = n1 * parseInt(n2Str[1]); 
                    const p3 = n1 * parseInt(n2Str[0]); 
                    
                    verticalCalcHTML = `
                        <div class="vertical-math text-xs">
                            <div>${n1Str}</div>
                            <div class="flex justify-between border-b border-gray-700 pb-[2px] mb-[2px]">
                                <span class="mr-2">×</span><span>${n2Str}</span>
                            </div>
                            <div>${p1}</div>
                            <div>${p2}<span class="invisible">0</span></div>
                            <div class="border-b border-gray-700 pb-[2px] mb-[2px]">
                                ${p3}<span class="invisible">00</span>
                            </div>
                            <div>${answer}</div>
                        </div>
                    `;
                }

                currentQuestionsData.push({
                    index: index + 1,
                    text: questionText,
                    horizontal: horizontalCalc,
                    verticalHTML: verticalCalcHTML,
                    ans: formatNumber(answer),
                    unit: templateObj.unit
                });
            });

            // 渲染至兩側版面
            renderGrid('questions-grid-left');
            renderGrid('questions-grid-right');
        }
        
        function renderGrid(gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            
            currentQuestionsData.forEach((data, i) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container relative flex flex-col p-2 border-b border-gray-200 bg-white h-full';
                
                // 移除了個別的「顯示解答」按鈕，讓版面更乾淨
                questionDiv.innerHTML = `
                    <div class="flex items-start gap-1 mb-1">
                        <span class="font-bold text-base text-gray-800">${data.index}.</span>
                        <p class="text-gray-900 text-sm leading-relaxed flex-grow text-justify tracking-wide">${data.text}</p>
                    </div>
                    
                    <!-- 空白計算區 (解答模式時會被 CSS 隱藏) -->
                    <div class="calc-space flex-grow min-h-[45px]"></div>

                    <!-- 解答區塊 (網頁呈現紅色強調，印出時透過 CSS 自動轉為黑白) -->
                    <div class="answer-content bg-red-50 rounded p-2 mt-auto border border-red-300 text-red-800 ${allAnswersVisible ? 'show' : ''}">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="text-xs text-red-600 mb-1 font-bold">【解答】</div>
                                <div class="text-sm font-medium tracking-wider mb-2">${data.horizontal}</div>
                                <div class="text-sm font-bold mt-1">答：${data.ans} ${data.unit}</div>
                            </div>
                            <div class="ml-2 pl-3 border-l border-red-300">
                                ${data.verticalHTML}
                            </div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(questionDiv);
            });
        }

        function toggleAllAnswers() {
            allAnswersVisible = !allAnswersVisible;
            const answerDivs = document.querySelectorAll('.answer-content');
            const toggleBtn = document.getElementById('toggle-ans-btn');

            answerDivs.forEach(div => {
                if (allAnswersVisible) {
                    div.classList.add('show');
                } else {
                    div.classList.remove('show');
                }
            });

            // 配合新的小按鈕尺寸，修正切換狀態時的圖示大小
            if(allAnswersVisible) {
                toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" /><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" /></svg> 隱藏網頁解答`;
                toggleBtn.classList.replace('bg-gray-600', 'bg-red-600');
                toggleBtn.classList.replace('hover:bg-gray-700', 'hover:bg-red-700');
            } else {
                toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" /></svg> 顯示網頁解答`;
                toggleBtn.classList.replace('bg-red-600', 'bg-gray-600');
                toggleBtn.classList.replace('hover:bg-red-700', 'hover:bg-gray-700');
            }
        }

        function exportPDF(includeAnswers) {
            document.body.style.cursor = 'wait';

            // 儲存目前的網頁解答顯示狀態
            const wasAnswersVisible = allAnswersVisible;
            
            // 強制調整解答區顯示狀態以符合匯出需求
            const answerDivs = document.querySelectorAll('.answer-content');
            answerDivs.forEach(div => {
                if (includeAnswers) div.classList.add('show');
                else div.classList.remove('show');
            });

            // 更新紙本標題 (顯示為解答卷或題目卷)
            const titleElements = document.querySelectorAll('.paper-title');
            titleElements.forEach(el => {
                if (includeAnswers) {
                    el.innerText = "練習卷 (解答)";
                    el.classList.add('text-red-700');
                } else {
                    el.innerText = "練習卷";
                    el.classList.remove('text-red-700');
                }
            });

            const element = document.getElementById('printable-content');
            
            // 進入 PDF 嚴格排版模式
            element.classList.remove('screen-view');
            element.classList.add('pdf-mode');

            // 如果是解答卷，加入 class 隱藏空白計算區，避免高度超出版面
            if (includeAnswers) {
                element.classList.add('is-answer-sheet');
            }

            // html2pdf 設定
            const opt = {
                margin:       0,
                filename:     includeAnswers ? '數學應用題_解答卷.pdf' : '數學應用題_題目卷.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2.5, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // 等待 DOM 確實切換 class 後再進行畫面擷取
            setTimeout(() => {
                html2pdf().set(opt).from(element).save().then(() => {
                    // 匯出完成，還原網頁排版
                    element.classList.remove('pdf-mode');
                    element.classList.remove('is-answer-sheet');
                    element.classList.add('screen-view');

                    // 還原原本的解答顯示狀態
                    answerDivs.forEach(div => {
                        if (wasAnswersVisible) div.classList.add('show');
                        else div.classList.remove('show');
                    });

                    titleElements.forEach(el => {
                        el.innerText = "練習卷";
                        el.classList.remove('text-red-700');
                    });
                    
                    document.body.style.cursor = 'default';
                }).catch(err => {
                    console.error('PDF 匯出失敗:', err);
                    alert('PDF 匯出發生錯誤，請稍後再試。');
                    
                    // 發生錯誤也要記得還原版面
                    element.classList.remove('pdf-mode');
                    element.classList.remove('is-answer-sheet');
                    element.classList.add('screen-view');
                    document.body.style.cursor = 'default';
                });
            }, 300);
        }

        // 初始化
        window.onload = function() {
            generateQuestions();
        };
    </script>
</body>
</html>
