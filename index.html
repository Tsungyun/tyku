<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式量角器測量工具 - 出題與測驗雙模式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 jsPDF 用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 確保畫布不滾動，交由內部 panel 控制滑動 */
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 隱藏/顯示的輔助類別 */
        .hidden-mode {
            display: none !important;
        }

        /* 量角器外部容器 */
        #protractor-container {
            position: absolute;
            z-index: 10;
            display: none; /* 進入學生模式才顯示 */
            left: 50px;
            top: 50px;
            /* 讓觸控只在量角器上生效，不影響背景 */
            touch-action: none;
        }

        /* 處理旋轉的包裝層 */
        #rotate-wrapper {
            position: relative;
            transform-origin: 50% 100%; /* 基準點：X軸中央，Y軸底部 */
            transform: rotate(0deg);
            display: inline-block; 
        }

        #protractor-img {
            display: block;
            width: 400px; /* 初始寬度 */
            height: auto;
            cursor: move;
            user-drag: none;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
            /* 關鍵魔法：去除白底保留刻度 */
            mix-blend-mode: multiply;
        }

        /* 基準點定位錨點 (絕對準確的旋轉中心) */
        #pivot-anchor {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 2px;
            height: 2px;
            background-color: transparent; 
        }

        /* 旋轉控制把手 (藍色，上方) */
        #rotate-handle {
            position: absolute;
            top: -40px; 
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background-color: #3b82f6; 
            border-radius: 50%;
            border: 2px solid white;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: white;
            font-size: 20px;
            user-select: none;
            touch-action: none;
        }
        #rotate-handle:active { cursor: grabbing; }

        /* 縮放控制把手 (綠色，右下角) */
        #scale-handle {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background-color: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            cursor: nwse-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            user-select: none;
            touch-action: none;
        }

        /* UI 面板 */
        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 340px;
            max-height: 90vh;
            overflow-y: auto; /* 允許面板內部捲動 */
            touch-action: auto; /* 恢復觸控滑動功能 */
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 繪圖區 -->
    <div id="canvas-container">
        <canvas id="angle-canvas"></canvas>
    </div>

    <!-- 量角器與控制把手 -->
    <div id="protractor-container">
        <div id="rotate-wrapper">
            <!-- 圖片來源：需與 HTML 同目錄下的 量角器_2.png -->
            <img id="protractor-img" src="量角器_2.png" alt="量角器" draggable="false">
            <div id="rotate-handle" title="拖曳旋轉">↻</div>
            <div id="scale-handle" title="拖曳縮放">⤡</div>
            <div id="pivot-anchor"></div>
        </div>
    </div>

    <!-- 教師出題面板 -->
    <div id="teacher-panel" class="ui-panel">
        <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">👨‍🏫 教師出題模式</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">手動設定角度 (0~360°):</label>
            <input type="number" id="input-angle" class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-500" placeholder="例如: 45" min="0" max="360">
        </div>
        
        <div class="flex flex-col gap-2 mb-6">
            <button id="add-q-btn" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-4 rounded transition-colors shadow text-sm">
                ➕ 加入單題
            </button>
            <div class="flex gap-2 mt-2">
                <button id="random-180-btn" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-2 rounded transition-colors shadow text-xs">
                    🎲 亂數 8 題<br>(180°內)
                </button>
                <button id="random-360-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-2 rounded transition-colors shadow text-xs">
                    🎲 亂數 8 題<br>(360°內)
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-1">※ 亂數出題保證不重複、為5的倍數、且自動傾斜圖形。</p>
        </div>

        <div class="mb-4">
            <h3 class="text-sm font-bold text-gray-700 mb-2">當前題庫清單：</h3>
            <ul id="q-list" class="text-sm border rounded bg-gray-50 min-h-[60px] max-h-[120px] overflow-y-auto p-2">
                <li class="text-gray-400 italic text-center py-2" id="empty-q-msg">尚無題目，請新增</li>
            </ul>
        </div>

        <button id="start-test-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition-colors shadow-lg disabled:opacity-50" disabled>
            🚀 鎖定題庫，開始測驗
        </button>

        <!-- PDF 匯出按鈕區塊 -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <p class="text-xs text-blue-600 font-bold mb-3 leading-relaxed">💡 提示：滿 8 題即可匯出。PDF 自動排版為 A4 橫向，一頁雙份(左右各8題，兩欄四列)，方便裁切！</p>
            <button id="export-q-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded mb-2 transition-colors text-sm shadow disabled:opacity-50" disabled>
                📄 匯出題目 (PDF)
            </button>
            <button id="export-a-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded transition-colors text-sm shadow disabled:opacity-50" disabled>
                📝 匯出解答 (PDF)
            </button>
        </div>
    </div>

    <!-- 學生測驗面板 -->
    <div id="student-panel" class="ui-panel hidden-mode">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-bold text-gray-800">🎓 角度測量</h2>
            <span id="score-display" class="text-sm font-semibold text-purple-600 bg-purple-100 px-2 py-1 rounded">第 1 題</span>
        </div>
        
        <p class="text-sm text-gray-600 mb-4">請拖曳、旋轉並縮放畫面上的量角器，將底邊正中央的「基準點」對準頂點，測量內側紅色弧線的角度。</p>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">您測量到的角度 (°):</label>
            <div class="flex gap-2">
                <input type="number" id="student-answer" class="border border-gray-300 rounded px-3 py-2 w-full text-lg font-bold text-center focus:ring-2 focus:ring-purple-500" placeholder="?" tabindex="1">
                <button id="check-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition-colors whitespace-nowrap">
                    送出
                </button>
            </div>
            <p id="feedback-msg" class="mt-3 text-sm font-bold hidden"></p>
        </div>
        
        <button id="next-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded transition-colors hidden shadow">
            下一題 ➔
        </button>
    </div>
</div>

<script>
    let questions = [];
    let currentProblemIndex = 0;
    let isTeacherMode = true;
    
    // Canvas 狀態
    let currentCanvasAngle = 0;
    let currentCanvasRotation = 0;
    let vertexX, vertexY;

    // DOM 綁定
    const canvas = document.getElementById('angle-canvas');
    const ctx = canvas.getContext('2d');
    const teacherPanel = document.getElementById('teacher-panel');
    const studentPanel = document.getElementById('student-panel');
    
    // 按鈕與輸入
    const inputAngle = document.getElementById('input-angle');
    const addQBtn = document.getElementById('add-q-btn');
    const random180Btn = document.getElementById('random-180-btn');
    const random360Btn = document.getElementById('random-360-btn');
    const qList = document.getElementById('q-list');
    const emptyQMsg = document.getElementById('empty-q-msg');
    const startTestBtn = document.getElementById('start-test-btn');
    const exportQBtn = document.getElementById('export-q-btn');
    const exportABtn = document.getElementById('export-a-btn');
    
    const studentAnswerInput = document.getElementById('student-answer');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const feedbackMsg = document.getElementById('feedback-msg');
    const scoreDisplay = document.getElementById('score-display');
    
    // 量角器物件
    const protractorContainer = document.getElementById('protractor-container');
    const rotateWrapper = document.getElementById('rotate-wrapper');
    const protractorImg = document.getElementById('protractor-img');
    const rotateHandle = document.getElementById('rotate-handle');
    const scaleHandle = document.getElementById('scale-handle');
    const pivotAnchor = document.getElementById('pivot-anchor');

    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // 頂點預設在畫面中央偏左
        vertexX = canvas.width / 2 - 100;
        vertexY = canvas.height / 2 + 50;
        
        if (isTeacherMode && currentCanvasAngle !== 0) {
            drawAngle(currentCanvasAngle, currentCanvasRotation);
        } else if (!isTeacherMode && questions.length > 0) {
            drawAngle(questions[currentProblemIndex].angle, questions[currentProblemIndex].rotation);
        }
    }

    // 繪製夾角 (乾淨無紅點版本，僅保留紅色弧線)
    function drawAngle(angleDegrees, rotationDegrees) {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const lineLength = Math.min(canvas.width, canvas.height) * 0.35;
        const radBase = rotationDegrees * Math.PI / 180;
        const radAngle = (rotationDegrees - angleDegrees) * Math.PI / 180; 

        ctx.lineWidth = 5;
        ctx.strokeStyle = '#1f2937'; 
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 畫兩條直線
        ctx.beginPath();
        ctx.moveTo(vertexX, vertexY);
        ctx.lineTo(vertexX + lineLength * Math.cos(radBase), vertexY + lineLength * Math.sin(radBase));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(vertexX, vertexY);
        ctx.lineTo(vertexX + lineLength * Math.cos(radAngle), vertexY + lineLength * Math.sin(radAngle));
        ctx.stroke();

        // 畫紅色的提示內角弧線
        const arcRadius = 45;
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
        ctx.lineWidth = 3;
        ctx.arc(vertexX, vertexY, arcRadius, radBase, radAngle, true);
        ctx.stroke();
        
        currentCanvasAngle = angleDegrees;
        currentCanvasRotation = rotationDegrees;
    }

    addQBtn.addEventListener('click', () => {
        const ang = parseInt(inputAngle.value);
        const rot = Math.floor(Math.random() * 360);
        
        if (isNaN(ang) || ang < 0 || ang > 360 || ang === 180 || ang === 360 || ang === 0) {
            alert('請輸入有效的角度 (不可為 0, 180, 360)');
            return;
        }

        questions.push({ angle: ang, rotation: rot });
        updateQList();
        drawAngle(ang, rot);
        inputAngle.value = '';
        inputAngle.focus();
    });

    // 隨機不重複出題演算法 (5的倍數)
    function generateUniqueRandomQs(maxAngle) {
        let possibleAngles = [];
        for (let i = 5; i <= maxAngle; i += 5) {
            if (i !== 180 && i !== 360) {
                possibleAngles.push(i);
            }
        }
        
        // 洗牌演算法 (Fisher-Yates Shuffle)
        for (let i = possibleAngles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [possibleAngles[i], possibleAngles[j]] = [possibleAngles[j], possibleAngles[i]];
        }
        
        questions = [];
        for (let i = 0; i < 8 && i < possibleAngles.length; i++) {
            questions.push({ 
                angle: possibleAngles[i], 
                rotation: Math.floor(Math.random() * 360) 
            });
        }
        updateQList();
        if (questions.length > 0) drawAngle(questions[0].angle, questions[0].rotation);
    }

    random180Btn.addEventListener('click', () => generateUniqueRandomQs(175));
    random360Btn.addEventListener('click', () => generateUniqueRandomQs(355));

    function updateQList() {
        const hasQuestions = questions.length > 0;
        emptyQMsg.style.display = hasQuestions ? 'none' : 'block';
        startTestBtn.disabled = !hasQuestions;
        exportQBtn.disabled = questions.length < 8; // 滿8題才能匯出
        exportABtn.disabled = questions.length < 8;
        
        qList.innerHTML = '';
        questions.forEach((q, index) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center py-1 border-b last:border-0';
            li.innerHTML = `
                <span>Q${index + 1}: <strong>${q.angle}°</strong></span>
                <button class="text-red-500 hover:text-red-700 text-xs px-2" onclick="removeQ(${index})">刪除</button>
            `;
            qList.appendChild(li);
        });
    }

    window.removeQ = function(index) {
        questions.splice(index, 1);
        updateQList();
        if (questions.length === 0) ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    startTestBtn.addEventListener('click', () => {
        if (questions.length === 0) return;
        isTeacherMode = false;
        teacherPanel.classList.add('hidden-mode');
        studentPanel.classList.remove('hidden-mode');
        
        protractorContainer.style.display = 'block';
        resetProtractorToCenter();
        currentProblemIndex = 0;
        loadProblemForStudent();
    });

    function loadProblemForStudent() {
        const q = questions[currentProblemIndex];
        drawAngle(q.angle, q.rotation);
        
        scoreDisplay.textContent = `第 ${currentProblemIndex + 1} / ${questions.length} 題`;
        studentAnswerInput.value = '';
        studentAnswerInput.disabled = false;
        
        feedbackMsg.classList.add('hidden');
        checkBtn.classList.remove('hidden');
        nextBtn.classList.add('hidden');
        
        rotateWrapper.style.transform = `rotate(0deg)`;
    }

    checkBtn.addEventListener('click', () => {
        const ans = parseInt(studentAnswerInput.value);
        feedbackMsg.classList.remove('hidden', 'text-green-600', 'text-red-600', 'bg-green-100', 'bg-red-100');
        
        if (isNaN(ans)) {
            feedbackMsg.textContent = '⚠️ 請輸入數字答案';
            feedbackMsg.classList.add('text-red-600');
            return;
        }

        const target = questions[currentProblemIndex].angle;
        const tolerance = 2; // 容許誤差

        if (Math.abs(ans - target) <= tolerance) {
            feedbackMsg.innerHTML = '✅ 答對了！測量非常精準！';
            feedbackMsg.classList.add('text-green-600', 'bg-green-100', 'p-2', 'rounded');
        } else {
            // 答錯給予正解提示
            feedbackMsg.innerHTML = `❌ 不太對喔。正確答案是 <strong>${target}°</strong>。<br>請觀察紅色弧線並重新對準「基準點」與「0度線」。`;
            feedbackMsg.classList.add('text-red-600', 'bg-red-50', 'p-2', 'rounded');
        }

        // 無論對錯，都隱藏送出按鈕，顯示下一題按鈕
        checkBtn.classList.add('hidden');
        studentAnswerInput.disabled = true;
        nextBtn.classList.remove('hidden');

        if (currentProblemIndex === questions.length - 1) {
            nextBtn.textContent = '🎉 測驗完成 (返回出題)';
            nextBtn.classList.replace('bg-green-500', 'bg-purple-600');
            nextBtn.classList.replace('hover:bg-green-600', 'hover:bg-purple-700');
        } else {
            nextBtn.textContent = '下一題 ➔';
            nextBtn.classList.replace('bg-purple-600', 'bg-green-500');
            nextBtn.classList.replace('hover:bg-purple-700', 'hover:bg-green-600');
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentProblemIndex < questions.length - 1) {
            // 前往下一題
            currentProblemIndex++;
            loadProblemForStudent();
        } else {
            // 結束測驗，返回老師模式
            isTeacherMode = true;
            questions = []; // 清空題庫重新開始
            updateQList();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            teacherPanel.classList.remove('hidden-mode');
            studentPanel.classList.add('hidden-mode');
            protractorContainer.style.display = 'none';
        }
    });

    studentAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !checkBtn.classList.contains('hidden')) {
            checkBtn.click();
        }
    });

    function resetProtractorToCenter() {
        const w = protractorImg.offsetWidth || 400;
        const h = protractorImg.offsetHeight || 200;
        protractorContainer.style.left = (window.innerWidth / 2 - w / 2) + 'px';
        protractorContainer.style.top = (window.innerHeight / 2 - h / 2) + 'px';
    }

    function getEventPos(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    // 1. 移動 (Drag)
    let isDragging = false;
    let dragStartX, dragStartY;
    let containerStartLeft, containerStartTop;

    protractorImg.addEventListener('mousedown', startDrag);
    protractorImg.addEventListener('touchstart', startDrag, {passive: false});

    function startDrag(e) {
        if (e.type === 'touchstart') e.preventDefault(); // 阻止背景跟著滑動
        isDragging = true;
        const pos = getEventPos(e);
        dragStartX = pos.x;
        dragStartY = pos.y;
        containerStartLeft = parseFloat(protractorContainer.style.left) || 0;
        containerStartTop = parseFloat(protractorContainer.style.top) || 0;

        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, {passive: false});
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
        if (!isDragging) return;
        if (e.type === 'touchmove') e.preventDefault();
        const pos = getEventPos(e);
        const dx = pos.x - dragStartX;
        const dy = pos.y - dragStartY;
        protractorContainer.style.left = `${containerStartLeft + dx}px`;
        protractorContainer.style.top = `${containerStartTop + dy}px`;
    }

    function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchend', stopDrag);
    }

    // 2. 旋轉 (Rotate)
    let isRotating = false;
    let exactPivotX, exactPivotY; 

    rotateHandle.addEventListener('mousedown', startRotate);
    rotateHandle.addEventListener('touchstart', startRotate, {passive: false});

    function startRotate(e) {
        e.preventDefault();
        e.stopPropagation();
        isRotating = true;
        
        const pivotRect = pivotAnchor.getBoundingClientRect();
        exactPivotX = pivotRect.left + pivotRect.width / 2;
        exactPivotY = pivotRect.top + pivotRect.height / 2;

        document.addEventListener('mousemove', onRotate);
        document.addEventListener('touchmove', onRotate, {passive: false});
        document.addEventListener('mouseup', stopRotate);
        document.addEventListener('touchend', stopRotate);
    }

    function onRotate(e) {
        if (!isRotating) return;
        if (e.type === 'touchmove') e.preventDefault();
        const pos = getEventPos(e);
        
        const dy = pos.y - exactPivotY;
        const dx = pos.x - exactPivotX;
        let angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        
        let currentProtractorRotation = angleDeg + 90;
        rotateWrapper.style.transform = `rotate(${currentProtractorRotation}deg)`;
    }

    function stopRotate() {
        isRotating = false;
        document.removeEventListener('mousemove', onRotate);
        document.removeEventListener('touchmove', onRotate);
        document.removeEventListener('mouseup', stopRotate);
        document.removeEventListener('touchend', stopRotate);
    }

    // 3. 縮放 (Scale)
    let isScaling = false;
    let scaleStartX;
    let imgStartWidth;

    scaleHandle.addEventListener('mousedown', startScale);
    scaleHandle.addEventListener('touchstart', startScale, {passive: false});

    function startScale(e) {
        e.preventDefault();
        e.stopPropagation();
        isScaling = true;
        const pos = getEventPos(e);
        scaleStartX = pos.x;
        imgStartWidth = protractorImg.offsetWidth;

        document.addEventListener('mousemove', onScale);
        document.addEventListener('touchmove', onScale, {passive: false});
        document.addEventListener('mouseup', stopScale);
        document.addEventListener('touchend', stopScale);
    }

    function onScale(e) {
        if (!isScaling) return;
        if (e.type === 'touchmove') e.preventDefault();
        const pos = getEventPos(e);
        
        const dx = pos.x - scaleStartX;
        let newWidth = imgStartWidth + dx;
        if (newWidth < 200) newWidth = 200;
        if (newWidth > 800) newWidth = 800;
        
        protractorImg.style.width = `${newWidth}px`;
    }

    function stopScale() {
        isScaling = false;
        document.removeEventListener('mousemove', onScale);
        document.removeEventListener('touchmove', onScale);
        document.removeEventListener('mouseup', stopScale);
        document.removeEventListener('touchend', stopScale);
    }

    function exportPDF(isAnswerMode) {
        if (questions.length < 8) {
            alert('題庫需滿 8 題才可匯出雙份排版！');
            return;
        }
        
        const { jsPDF } = window.jspdf;
        // A4 橫向 (landscape): 297 x 210 mm
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        
        const qsToExport = questions.slice(0, 8);

        // A4 裁半
        const halfWidth = 297 / 2; // 148.5 mm
        
        // 八格簿：2 欄 4 列
        const cellW = halfWidth / 2; // 74.25 mm 寬
        const cellH = (210 - 20) / 4; // 扣除上下邊界後分4列
        const marginTop = 10;
        const lineLength = 16; 
        const arcRadius = 4;

        // 中央虛線裁切線
        doc.setDrawColor(200, 200, 200);
        doc.setLineDashPattern([2, 2], 0);
        doc.line(halfWidth, 5, halfWidth, 205);
        doc.setLineDashPattern([], 0);

        for (let i = 0; i < qsToExport.length; i++) {
            const q = qsToExport[i];
            const displayNum = i + 1; // 左邊 1~8，右邊 1~8
            
            // 決定在此半張紙內的哪一欄、哪一列
            const gridCol = i % 2; // 0 左欄, 1 右欄
            const gridRow = Math.floor(i / 2); // 0~3 列

            // 雙份列印：左右各畫一次一模一樣的
            for (let half = 0; half < 2; half++) {
                const baseX = half * halfWidth + gridCol * cellW;
                const baseY = marginTop + gridRow * cellH;
                
                const textX = baseX + 8;
                const textY = baseY + 12;

                doc.setFontSize(12);
                doc.setTextColor(0, 0, 0);
                doc.text(`Q ${displayNum}.`, textX, textY);
                
                if (isAnswerMode) {
                    doc.setTextColor(220, 38, 38); 
                    doc.text(`Ans: ${q.angle}°`, textX + 15, textY);
                }

                // 中心點
                const vX = baseX + cellW / 2;
                const vY = baseY + cellH / 2 + 5;
                
                const radBase = q.rotation * Math.PI / 180;
                const radAngle = (q.rotation - q.angle) * Math.PI / 180;
                
                const endX1 = vX + lineLength * Math.cos(radBase);
                const endY1 = vY + lineLength * Math.sin(radBase);
                const endX2 = vX + lineLength * Math.cos(radAngle);
                const endY2 = vY + lineLength * Math.sin(radAngle);
                
                // 畫兩邊
                doc.setLineWidth(0.6);
                doc.setDrawColor(31, 41, 55); 
                doc.line(vX, vY, endX1, endY1);
                doc.line(vX, vY, endX2, endY2);

                // 畫提示弧線
                doc.setLineWidth(0.4);
                doc.setDrawColor(239, 68, 68);
                const segments = 15;
                const angleStep = (radAngle - radBase) / segments;
                let lastX = vX + arcRadius * Math.cos(radBase);
                let lastY = vY + arcRadius * Math.sin(radBase);

                for (let s = 1; s <= segments; s++) {
                    const currentAngle = radBase + s * angleStep;
                    const nextX = vX + arcRadius * Math.cos(currentAngle);
                    const nextY = vY + arcRadius * Math.sin(currentAngle);
                    doc.line(lastX, lastY, nextX, nextY);
                    lastX = nextX;
                    lastY = nextY;
                }
            }
        }

        const fileName = isAnswerMode ? '測量角度_解答_一頁雙份(2x4排版).pdf' : '測量角度_題目_一頁雙份(2x4排版).pdf';
        doc.save(fileName);
    }

    exportQBtn.addEventListener('click', () => exportPDF(false));
    exportABtn.addEventListener('click', () => exportPDF(true));

    window.onload = init;

</script>
