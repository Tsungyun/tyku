<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動式量角器測量工具 - 出題與測驗雙模式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 jsPDF 用於匯出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 防止滾動，確保操作體驗 */
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* 禁用預設觸控手勢 (如雙指縮放、滑動)，交給 JS 處理 */
        }
        
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 隱藏/顯示的輔助類別 */
        .hidden-mode {
            display: none !important;
        }

        /* 量角器外部容器 (處理位置 x, y) */
        #protractor-container {
            position: absolute;
            z-index: 10;
            /* 預設隱藏，進入學生模式才顯示 */
            display: none; 
            left: 50px;
            top: 50px;
        }

        /* 處理旋轉的包裝層 */
        #rotate-wrapper {
            position: relative;
            transform-origin: 50% 100%; /* 基準點：X軸中央，Y軸底部 */
            transform: rotate(0deg);
            /* 確保旋轉時，內部元素的排版基準不會跑掉 */
            display: inline-block; 
        }

        #protractor-img {
            display: block;
            width: 400px; /* 初始寬度 */
            height: auto;
            cursor: move; /* 滑鼠游標：移動 */
            user-drag: none;
            -webkit-user-drag: none;
            /* 防止選取導致拖曳卡頓 */
            user-select: none;
            -webkit-user-select: none;
            /* 關鍵魔法：讓圖片的白色背景與下層畫布混合變透明，保留深色刻度 */
            mix-blend-mode: multiply;
        }

        /* 基準點定位錨點 (絕對準確的旋轉中心) */
        #pivot-anchor {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 2px;
            height: 2px;
            background-color: transparent; /* 隱藏起來，僅供 JS 抓座標 */
        }

        /* 旋轉控制把手 (藍色，上方) */
        #rotate-handle {
            position: absolute;
            top: -40px; 
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background-color: #3b82f6; 
            border-radius: 50%;
            border: 2px solid white;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: white;
            font-size: 20px;
            user-select: none;
        }
        #rotate-handle:active { cursor: grabbing; }

        /* 縮放控制把手 (綠色，右下角) */
        #scale-handle {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 30px;
            height: 30px;
            background-color: #10b981;
            border-radius: 50%;
            border: 2px solid white;
            cursor: nwse-resize;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            user-select: none;
        }

        /* UI 面板共用樣式 */
        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 340px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 繪圖區 -->
    <div id="canvas-container">
        <canvas id="angle-canvas"></canvas>
    </div>

    <!-- 量角器與控制把手 -->
    <div id="protractor-container">
        <div id="rotate-wrapper">
            <!-- 圖片來源：需與 HTML 同目錄下的 量角器_2.png -->
            <img id="protractor-img" src="量角器_2.png" alt="量角器" draggable="false">
            
            <!-- 旋轉把手 -->
            <div id="rotate-handle" title="拖曳旋轉">↻</div>
            
            <!-- 縮放把手 -->
            <div id="scale-handle" title="拖曳縮放">⤡</div>
            
            <!-- 精確的基準點定位錨點 (位於底邊正中央) -->
            <div id="pivot-anchor"></div>
        </div>
    </div>

    <!-- 教師出題面板 -->
    <div id="teacher-panel" class="ui-panel">
        <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">👨‍🏫 教師出題模式</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">設定夾角角度 (0~180°):</label>
            <input type="number" id="input-angle" class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-500" value="45" min="0" max="180">
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">圖形傾斜角度 (0~360°):</label>
            <div class="flex gap-2">
                <input type="number" id="input-rotation" class="border border-gray-300 rounded px-3 py-2 w-full focus:ring-2 focus:ring-blue-500" value="0">
                <button id="random-rot-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded" title="隨機傾斜">🎲</button>
            </div>
            <p class="text-xs text-gray-500 mt-1">設定傾斜可防止學生只量單邊。</p>
        </div>

        <button id="preview-btn" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 font-semibold py-2 px-4 rounded mb-2 transition-colors">
            👀 預覽當前角度
        </button>
        
        <button id="add-q-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded mb-6 transition-colors shadow">
            ➕ 加入題庫
        </button>

        <div class="mb-4">
            <h3 class="text-sm font-bold text-gray-700 mb-2">當前題庫清單：</h3>
            <ul id="q-list" class="text-sm border rounded bg-gray-50 min-h-[60px] max-h-[120px] overflow-y-auto p-2">
                <li class="text-gray-400 italic text-center py-2" id="empty-q-msg">尚無題目，請新增</li>
            </ul>
        </div>

        <button id="start-test-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition-colors shadow-lg disabled:opacity-50" disabled>
            🚀 鎖定題庫，開始測驗
        </button>

        <!-- PDF 匯出按鈕區塊 -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <button id="export-q-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded mb-2 transition-colors text-sm shadow">
                📄 匯出題目 (PDF)
            </button>
            <button id="export-a-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded transition-colors text-sm shadow">
                📝 匯出解答 (PDF)
            </button>
        </div>
    </div>

    <!-- 學生測驗面板 -->
    <div id="student-panel" class="ui-panel hidden-mode">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-bold text-gray-800">🎓 角度測量</h2>
            <span id="score-display" class="text-sm font-semibold text-purple-600 bg-purple-100 px-2 py-1 rounded">第 1 題</span>
        </div>
        
        <p class="text-sm text-gray-600 mb-4">請拖曳、旋轉並縮放畫面上的量角器，將底邊正中央的「基準點」對準頂點，測量夾角並輸入答案。</p>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">您測量到的角度 (°):</label>
            <div class="flex gap-2">
                <input type="number" id="student-answer" class="border border-gray-300 rounded px-3 py-2 w-full text-lg font-bold text-center focus:ring-2 focus:ring-purple-500" placeholder="?" tabindex="1">
                <button id="check-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition-colors whitespace-nowrap">
                    送出
                </button>
            </div>
            <p id="feedback-msg" class="mt-3 text-sm font-bold hidden"></p>
        </div>
        
        <button id="next-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded transition-colors hidden shadow">
            下一題 ➔
        </button>
    </div>
</div>

<script>
    // --- 應用程式狀態 ---
    let questions = [];
    let currentProblemIndex = 0;
    let isTeacherMode = true;
    
    // 目前繪製在 Canvas 上的角度狀態
    let currentCanvasAngle = 0;
    let currentCanvasRotation = 0;
    let vertexX, vertexY;

    // --- DOM 元素綁定 ---
    const canvas = document.getElementById('angle-canvas');
    const ctx = canvas.getContext('2d');
    
    const teacherPanel = document.getElementById('teacher-panel');
    const studentPanel = document.getElementById('student-panel');
    
    const inputAngle = document.getElementById('input-angle');
    const inputRotation = document.getElementById('input-rotation');
    const randomRotBtn = document.getElementById('random-rot-btn');
    const previewBtn = document.getElementById('preview-btn');
    const addQBtn = document.getElementById('add-q-btn');
    const qList = document.getElementById('q-list');
    const emptyQMsg = document.getElementById('empty-q-msg');
    const startTestBtn = document.getElementById('start-test-btn');
    const exportQBtn = document.getElementById('export-q-btn');
    const exportABtn = document.getElementById('export-a-btn');
    
    const studentAnswerInput = document.getElementById('student-answer');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const feedbackMsg = document.getElementById('feedback-msg');
    const scoreDisplay = document.getElementById('score-display');
    
    const protractorContainer = document.getElementById('protractor-container');
    const rotateWrapper = document.getElementById('rotate-wrapper');
    const protractorImg = document.getElementById('protractor-img');
    const rotateHandle = document.getElementById('rotate-handle');
    const scaleHandle = document.getElementById('scale-handle');
    const pivotAnchor = document.getElementById('pivot-anchor');

    // --- 初始化 ---
    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        // 初始清空畫面
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // 頂點預設在畫面中央偏左，保留右側給 UI 面板
        vertexX = canvas.width / 2 - 100;
        vertexY = canvas.height / 2 + 50;
        
        // 重新繪圖
        if (isTeacherMode && currentCanvasAngle !== 0) {
            drawAngle(currentCanvasAngle, currentCanvasRotation);
        } else if (!isTeacherMode && questions.length > 0) {
            drawAngle(questions[currentProblemIndex].angle, questions[currentProblemIndex].rotation);
        }
    }

    // --- 繪圖邏輯 ---
    function drawAngle(angleDegrees, rotationDegrees) {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 線條長度依據螢幕大小動態調整
        const lineLength = Math.min(canvas.width, canvas.height) * 0.35;
        
        // 角度轉弧度
        const radBase = rotationDegrees * Math.PI / 180;
        const radAngle = (rotationDegrees - angleDegrees) * Math.PI / 180; 

        ctx.lineWidth = 5;
        ctx.strokeStyle = '#1f2937'; 
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 第一條線
        ctx.beginPath();
        ctx.moveTo(vertexX, vertexY);
        ctx.lineTo(vertexX + lineLength * Math.cos(radBase), vertexY + lineLength * Math.sin(radBase));
        ctx.stroke();

        // 第二條線
        ctx.beginPath();
        ctx.moveTo(vertexX, vertexY);
        ctx.lineTo(vertexX + lineLength * Math.cos(radAngle), vertexY + lineLength * Math.sin(radAngle));
        ctx.stroke();
        
        // 紀錄目前畫面上的狀態
        currentCanvasAngle = angleDegrees;
        currentCanvasRotation = rotationDegrees;
    }

    // --- 教師出題模式邏輯 ---
    
    randomRotBtn.addEventListener('click', () => {
        inputRotation.value = Math.floor(Math.random() * 360);
    });

    previewBtn.addEventListener('click', () => {
        const ang = parseInt(inputAngle.value) || 0;
        const rot = parseInt(inputRotation.value) || 0;
        drawAngle(ang, rot);
    });

    addQBtn.addEventListener('click', () => {
        const ang = parseInt(inputAngle.value);
        const rot = parseInt(inputRotation.value) || 0;
        
        if (isNaN(ang) || ang < 0 || ang > 360) {
            alert('請輸入有效的角度');
            return;
        }

        questions.push({ angle: ang, rotation: rot });
        updateQList();
        
        // 在畫面上預覽剛加入的題目
        drawAngle(ang, rot);
        
        // 準備下一題預設值 (稍微變化一下)
        inputAngle.value = '';
        inputRotation.value = Math.floor(Math.random() * 360);
        inputAngle.focus();
    });

    function updateQList() {
        if (questions.length > 0) {
            emptyQMsg.style.display = 'none';
            startTestBtn.disabled = false;
            exportQBtn.disabled = false;
            exportABtn.disabled = false;
        } else {
            emptyQMsg.style.display = 'block';
            startTestBtn.disabled = true;
            exportQBtn.disabled = true;
            exportABtn.disabled = true;
        }
        
        // 重新渲染清單
        qList.innerHTML = '';
        questions.forEach((q, index) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center py-1 border-b last:border-0';
            li.innerHTML = `
                <span>題 ${index + 1}: <strong>${q.angle}°</strong> <span class="text-xs text-gray-500">(傾斜 ${q.rotation}°)</span></span>
                <button class="text-red-500 hover:text-red-700 text-xs px-2" onclick="removeQ(${index})">刪除</button>
            `;
            qList.appendChild(li);
        });
    }

    window.removeQ = function(index) {
        questions.splice(index, 1);
        updateQList();
        if (questions.length === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清空畫面
        }
    };

    // --- PDF 匯出邏輯 ---
    function generatePDF(isAnswerMode) {
        const { jsPDF } = window.jspdf;
        // 建立 A4 直式文件 (單位: mm)
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        
        const pageWidth = 210;
        const pageHeight = 297;
        const margin = 12; // 邊距
        const cols = 2;
        const rows = 4;
        
        const cellWidth = (pageWidth - margin * 2) / cols;
        const cellHeight = (pageHeight - margin * 2) / rows;
        const lineLen = 30; // 輸出的線條長度(mm)

        questions.forEach((q, index) => {
            // 每滿 8 題自動換頁
            if (index > 0 && index % 8 === 0) {
                doc.addPage();
            }
            
            const pageIndex = index % 8;
            const col = pageIndex % 2;
            const row = Math.floor(pageIndex / 2);
            
            const startX = margin + col * cellWidth;
            const startY = margin + row * cellHeight;
            const cx = startX + cellWidth / 2;
            const cy = startY + cellHeight / 2 + 5; 
            
            // 繪製排版外框格線 (淺灰色)
            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.3);
            doc.rect(startX, startY, cellWidth, cellHeight);
            
            // 繪製題號 (使用英文 Q 以避免預設字型中文亂碼)
            doc.setTextColor(50, 50, 50);
            doc.setFontSize(14);
            doc.text(`Q ${index + 1}`, startX + 5, startY + 8);
            
            // 如果是解答模式，印出紅色的答案角度
            if (isAnswerMode) {
                doc.setTextColor(239, 68, 68); // Tailwind red-500
                doc.setFontSize(16);
                doc.text(`Ans: ${q.angle} deg`, startX + 5, startY + cellHeight - 5);
            }
            
            // 計算 PDF 內的角度繪製坐標
            const radBase = q.rotation * Math.PI / 180;
            const radAngle = (q.rotation - q.angle) * Math.PI / 180;
            
            const x1 = cx + lineLen * Math.cos(radBase);
            const y1 = cy + lineLen * Math.sin(radBase);
            const x2 = cx + lineLen * Math.cos(radAngle);
            const y2 = cy + lineLen * Math.sin(radAngle);
            
            // 繪製夾角線條 (黑色)
            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(1);
            doc.line(cx, cy, x1, y1);
            doc.line(cx, cy, x2, y2);
        });

        const filename = isAnswerMode ? 'angles_answers.pdf' : 'angles_questions.pdf';
        doc.save(filename);
    }

    exportQBtn.addEventListener('click', () => generatePDF(false));
    exportABtn.addEventListener('click', () => generatePDF(true));

    startTestBtn.addEventListener('click', () => {
        if (questions.length === 0) return;
        
        // 切換模式
        isTeacherMode = false;
        teacherPanel.classList.add('hidden-mode');
        studentPanel.classList.remove('hidden-mode');
        
        // 顯示量角器並置中
        protractorContainer.style.display = 'block';
        resetProtractorToCenter();
        
        // 載入第一題
        currentProblemIndex = 0;
        loadProblemForStudent();
    });

    // --- 學生測驗模式邏輯 ---
    function loadProblemForStudent() {
        const q = questions[currentProblemIndex];
        drawAngle(q.angle, q.rotation);
        
        scoreDisplay.textContent = `第 ${currentProblemIndex + 1} / ${questions.length} 題`;
        studentAnswerInput.value = '';
        studentAnswerInput.disabled = false;
        feedbackMsg.classList.add('hidden');
        checkBtn.classList.remove('hidden');
        nextBtn.classList.add('hidden');
        
        // 每次新題目，稍微重置一下量角器角度，但保留位置和大小，讓學生自己調
        // 或者強制復原，這裡選擇重置旋轉角度
        currentProtractorRotation = 0;
        rotateWrapper.style.transform = `rotate(0deg)`;
    }

    checkBtn.addEventListener('click', () => {
        const ans = parseInt(studentAnswerInput.value);
        feedbackMsg.classList.remove('hidden', 'text-green-600', 'text-red-600', 'bg-green-100', 'bg-red-100');
        
        if (isNaN(ans)) {
            feedbackMsg.textContent = '⚠️ 請輸入數字答案';
            feedbackMsg.classList.add('text-red-600');
            return;
        }

        const target = questions[currentProblemIndex].angle;
        const tolerance = 2; // 容許誤差正負2度

        if (Math.abs(ans - target) <= tolerance) {
            feedbackMsg.innerHTML = '✅ 答對了！測量非常精準！';
            feedbackMsg.classList.add('text-green-600', 'bg-green-100', 'p-2', 'rounded');
            
            checkBtn.classList.add('hidden');
            studentAnswerInput.disabled = true;
            
            if (currentProblemIndex < questions.length - 1) {
                nextBtn.textContent = '下一題 ➔';
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.textContent = '🎉 測驗完成 (重新開始)';
                nextBtn.classList.remove('hidden');
                nextBtn.classList.replace('bg-green-500', 'bg-purple-600');
                nextBtn.classList.replace('hover:bg-green-600', 'hover:bg-purple-700');
            }
        } else {
            let hint = ans > target ? '偏大' : '偏小';
            feedbackMsg.innerHTML = `❌ 不太對喔，你的答案有點${hint}。<br>請重新對準「基準點」與「0度線」再試一次！`;
            feedbackMsg.classList.add('text-red-600', 'bg-red-50', 'p-2', 'rounded');
            studentAnswerInput.focus();
            studentAnswerInput.select();
        }
    });

    studentAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !checkBtn.classList.contains('hidden')) {
            checkBtn.click();
        }
    });

    // --- PDF 匯出功能 (A4 橫向, 兩欄八列) ---
    async function exportPDF(isAnswer) {
        if (questions.length === 0) {
            alert('題庫中尚無題目，請先新增題目！');
            return;
        }

        const { jsPDF } = window.jspdf;
        // 建立 A4 橫向 (landscape) 的 PDF
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        const margin = 10;
        const pageWidth = 297;
        const pageHeight = 210;
        
        // 可用區域
        const usableWidth = pageWidth - margin * 2;
        const usableHeight = pageHeight - margin * 2;
        
        // 兩欄八列，共 16 格
        const cols = 2;
        const rows = 8;
        const cellWidth = usableWidth / cols; // 約 138.5 mm
        const cellHeight = usableHeight / rows; // 約 23.75 mm
        const lineLength = 9; // PDF 內繪製的角度線段長度 (mm)

        questions.forEach((q, index) => {
            // 每 16 題新增一頁
            if (index > 0 && index % 16 === 0) {
                doc.addPage();
            }

            const indexOnPage = index % 16;
            // 決定屬於哪一欄 (0~7 題在左欄，8~15 題在右欄)
            const col = Math.floor(indexOnPage / 8); 
            // 決定屬於哪一列 (0~7)
            const row = indexOnPage % 8;

            // 計算該格子的起始 X, Y 座標
            const startX = margin + col * cellWidth;
            const startY = margin + row * cellHeight;
            
            // 計算繪製圖形的中心點 (稍微偏右，留空間給題號)
            const centerX = startX + (cellWidth / 2) + 10;
            const centerY = startY + (cellHeight / 2);

            // 繪製文字 (題號)
            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            doc.text(`Q ${index + 1}`, startX + 5, startY + 8);
            
            // 如果是解答模式，印出紅色答案
            if (isAnswer) {
                doc.setFontSize(11);
                doc.setTextColor(255, 0, 0);
                doc.text(`Ans: ${q.angle} deg`, startX + 5, startY + 16);
            }

            // 繪製夾角向量圖形 (保證印出來不失真)
            const radBase = q.rotation * Math.PI / 180;
            const radAngle = (q.rotation - q.angle) * Math.PI / 180;

            doc.setDrawColor(30, 30, 30);
            doc.setLineWidth(0.6);
            
            // 第一條線
            doc.line(centerX, centerY, centerX + lineLength * Math.cos(radBase), centerY + lineLength * Math.sin(radBase));
            // 第二條線
            doc.line(centerX, centerY, centerX + lineLength * Math.cos(radAngle), centerY + lineLength * Math.sin(radAngle));
        });

        // 儲存檔案
        const filename = isAnswer ? '夾角測量_解答版.pdf' : '夾角測量_題目版.pdf';
        doc.save(filename);
    }

    exportQBtn.addEventListener('click', () => exportPDF(false));
    exportABtn.addEventListener('click', () => exportPDF(true));


    function resetProtractorToCenter() {
        const w = protractorImg.offsetWidth || 400;
        const h = protractorImg.offsetHeight || 200;
        protractorContainer.style.left = (window.innerWidth / 2 - w / 2) + 'px';
        protractorContainer.style.top = (window.innerHeight / 2 - h / 2) + 'px';
    }


    // ==========================================
    // 量角器互動邏輯 (移動、旋轉、縮放)
    // ==========================================
    
    function getEventPos(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    // --- 1. 移動 (Drag) ---
    let isDragging = false;
    let dragStartX, dragStartY;
    let containerStartLeft, containerStartTop;

    protractorImg.addEventListener('mousedown', startDrag);
    protractorImg.addEventListener('touchstart', startDrag, {passive: false});

    function startDrag(e) {
        e.preventDefault(); // 防止預設行為 (例如拖曳圖片)
        isDragging = true;
        const pos = getEventPos(e);
        dragStartX = pos.x;
        dragStartY = pos.y;
        
        containerStartLeft = parseFloat(protractorContainer.style.left) || 0;
        containerStartTop = parseFloat(protractorContainer.style.top) || 0;

        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag, {passive: false});
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = getEventPos(e);
        const dx = pos.x - dragStartX;
        const dy = pos.y - dragStartY;
        
        protractorContainer.style.left = `${containerStartLeft + dx}px`;
        protractorContainer.style.top = `${containerStartTop + dy}px`;
    }

    function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('mouseup', stopDrag);
        document.removeEventListener('touchend', stopDrag);
    }


    // --- 2. 旋轉 (Rotate) ---
    let isRotating = false;
    let currentProtractorRotation = 0;
    // 記錄精確基準點的螢幕座標
    let exactPivotX, exactPivotY; 

    rotateHandle.addEventListener('mousedown', startRotate);
    rotateHandle.addEventListener('touchstart', startRotate, {passive: false});

    function startRotate(e) {
        e.preventDefault();
        e.stopPropagation();
        isRotating = true;
        
        // 關鍵：利用 DOM 中隱藏的 #pivot-anchor 來獲取當下最精確的基準點螢幕座標
        // 這樣無論容器如何移動、圖片如何縮放，旋轉軸心絕對不會跑掉
        const pivotRect = pivotAnchor.getBoundingClientRect();
        exactPivotX = pivotRect.left + pivotRect.width / 2;
        exactPivotY = pivotRect.top + pivotRect.height / 2;

        document.addEventListener('mousemove', onRotate);
        document.addEventListener('touchmove', onRotate, {passive: false});
        document.addEventListener('mouseup', stopRotate);
        document.addEventListener('touchend', stopRotate);
    }

    function onRotate(e) {
        if (!isRotating) return;
        e.preventDefault();
        const pos = getEventPos(e);
        
        // 計算滑鼠位置與基準點的絕對角度 (Math.atan2 回傳弧度)
        const dy = pos.y - exactPivotY;
        const dx = pos.x - exactPivotX;
        let angleRad = Math.atan2(dy, dx);
        let angleDeg = angleRad * (180 / Math.PI);
        
        // 因為把手在正上方 (相對於基準點是 -90 度)
        // 所以滑鼠角度加上 90 度，就是圖片應該旋轉的角度
        currentProtractorRotation = angleDeg + 90;
        
        rotateWrapper.style.transform = `rotate(${currentProtractorRotation}deg)`;
    }

    function stopRotate() {
        isRotating = false;
        document.removeEventListener('mousemove', onRotate);
        document.removeEventListener('touchmove', onRotate);
        document.removeEventListener('mouseup', stopRotate);
        document.removeEventListener('touchend', stopRotate);
    }


    // --- 3. 縮放 (Scale) ---
    let isScaling = false;
    let scaleStartX;
    let imgStartWidth;

    scaleHandle.addEventListener('mousedown', startScale);
    scaleHandle.addEventListener('touchstart', startScale, {passive: false});

    function startScale(e) {
        e.preventDefault();
        e.stopPropagation();
        isScaling = true;
        const pos = getEventPos(e);
        scaleStartX = pos.x;
        // 獲取目前圖片的寬度
        imgStartWidth = protractorImg.offsetWidth;

        document.addEventListener('mousemove', onScale);
        document.addEventListener('touchmove', onScale, {passive: false});
        document.addEventListener('mouseup', stopScale);
        document.addEventListener('touchend', stopScale);
    }

    function onScale(e) {
        if (!isScaling) return;
        e.preventDefault();
        const pos = getEventPos(e);
        
        // 根據滑鼠水平移動距離來增減寬度
        const dx = pos.x - scaleStartX;
        
        // 限制最小與最大尺寸 (避免縮到不見或太大)
        let newWidth = imgStartWidth + dx;
        if (newWidth < 200) newWidth = 200;
        if (newWidth > 800) newWidth = 800;
        
        // 直接改變圖片的實體寬度，這樣底部的基準點依然會保持在正中央 (50% 100%)
        protractorImg.style.width = `${newWidth}px`;
    }

    function stopScale() {
        isScaling = false;
        document.removeEventListener('mousemove', onScale);
        document.removeEventListener('touchmove', onScale);
        document.removeEventListener('mouseup', stopScale);
        document.removeEventListener('touchend', stopScale);
    }

    // --- PDF 匯出功能 ---
    function exportPDF(isAnswerMode) {
        if (questions.length === 0) {
            alert('題庫中沒有題目可匯出！');
            return;
        }
        
        const { jsPDF } = window.jspdf;
        // A4 橫向 (landscape): 297 x 210 mm
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        
        // 設定基本排版參數
        const marginTop = 15;
        const colWidth = 297 / 2; // 148.5 mm (一半的寬度)
        const rowHeight = (210 - 30) / 8; // 分為 8 列的高度
        const lineLength = 18; // 向量線段長度 (mm)

        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const pageIndex = i % 16; // 橫向兩欄，每頁最多 16 題
            
            // 如果是新的一頁 (且不是第一頁)
            if (i > 0 && pageIndex === 0) {
                doc.addPage();
            }

            // 決定欄 (0: 左欄, 1: 右欄) 與 列 (0~7)
            const col = Math.floor(pageIndex / 8); 
            const row = pageIndex % 8;

            // 核心修改：無論左右欄，題號皆顯示為 1 到 8
            const displayNum = row + 1;

            // 基準座標計算
            const baseX = col * colWidth;
            const baseY = marginTop + row * rowHeight;
            
            // 題號/文字的 X, Y
            const textX = baseX + 15;
            const textY = baseY + 12;

            // 繪製題號
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text(`Q ${displayNum}.`, textX, textY);
            
            if (isAnswerMode) {
                doc.setTextColor(220, 38, 38); // 紅色解答文字
                doc.text(`Ans: ${q.angle}°`, textX + 15, textY);
            }

            // 畫夾角線條的頂點位置
            const vX = baseX + 75;
            const vY = baseY + 11;
            
            const radBase = q.rotation * Math.PI / 180;
            const radAngle = (q.rotation - q.angle) * Math.PI / 180;
            
            const endX1 = vX + lineLength * Math.cos(radBase);
            const endY1 = vY + lineLength * Math.sin(radBase);
            
            const endX2 = vX + lineLength * Math.cos(radAngle);
            const endY2 = vY + lineLength * Math.sin(radAngle);
            
            doc.setLineWidth(0.6);
            doc.setDrawColor(31, 41, 55); 
            
            // 畫出兩條線，構成夾角 (不畫紅點)
            doc.line(vX, vY, endX1, endY1);
            doc.line(vX, vY, endX2, endY2);
        }

        const fileName = isAnswerMode ? 'angles_answers.pdf' : 'angles_questions.pdf';
        doc.save(fileName);
    }

    if (document.getElementById('export-q-btn')) {
        document.getElementById('export-q-btn').addEventListener('click', () => exportPDF(false));
    }
    if (document.getElementById('export-a-btn')) {
        document.getElementById('export-a-btn').addEventListener('click', () => exportPDF(true));
    }

    // 啟動程式
    window.onload = init;

</script>
