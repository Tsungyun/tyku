<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全等三角形(旋轉) - 互動與列印卷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎設定與字體 */
        body {
            font-family: 'BiauKai', 'DFKai-SB', 'KaiTi', 'Times New Roman', serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* 數學符號上橫線 (表示線段) */
        .overline {
            text-decoration: overline;
        }

        /* 填答空格樣式 */
        .blank-input {
            display: inline-block;
            min-width: 40px;
            border-bottom: 1px solid #333;
            text-align: center;
            color: #2563eb; /* 學生填答用藍色 */
            cursor: pointer;
            padding: 0 4px;
            min-height: 1.2em;
            font-family: sans-serif;
            font-weight: bold;
            transition: all 0.2s;
        }
        .blank-input.active {
            background-color: #e0f2fe;
            border-bottom: 2px solid #0284c7;
            border-radius: 4px 4px 0 0;
        }
        
        /* 解答模式下的空格樣式 */
        .answer-mode .blank-input {
            color: #ef4444 !important; /* 解答用紅色 */
            border-bottom: none;
        }
        .answer-mode .overline-ans {
            text-decoration: overline;
        }

        /* 網頁版排版 */
        @media screen {
            #print-container {
                max-width: 800px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
                padding-top: 5rem; /* 閃避上方固定按鈕 */
                padding-bottom: 18rem; /* 閃避下方小鍵盤 */
            }
            .problem-block {
                background: white;
                padding: 1rem;
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }
        }

        /* 列印專用樣式 (A4 橫向，極小邊界，分左右兩半，每半2題) */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm; /* 極小邊界 */
            }
            body {
                background: white;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            
            #print-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                grid-auto-flow: column; /* 讓 1,2題在左，3,4題在右 */
                column-gap: 12mm;
                row-gap: 2mm;
                height: 98vh; /* 確保不超過一頁 */
                position: relative;
            }

            /* 中間裁切虛線 */
            #print-container::after {
                content: '';
                position: absolute;
                top: 0; 
                bottom: 0; 
                left: 50%;
                border-left: 1px dashed #999;
                transform: translateX(-50%);
            }

            .problem-block {
                break-inside: avoid;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }
            
            /* 列印時縮小標題字，去除不必要的間距 */
            .print-title {
                font-size: 10pt;
                margin-bottom: 2px;
                text-align: center;
                color: #666;
            }
            
            svg {
                max-height: 100px; /* 限制圖形高度避免擠壓文字 */
            }
        }

        svg {
            display: block;
            margin: 0 auto;
        }

        /* 小鍵盤動畫 */
        #keypad {
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
        }
        #keypad.show {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 控制面板 (列印時隱藏) -->
    <div class="fixed top-0 left-0 w-full bg-slate-800 p-3 flex gap-3 justify-center shadow-lg no-print z-50 flex-wrap">
        <button onclick="generateAll()" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow transition text-sm">
            重新出題 (隨機4題)
        </button>
        <button onclick="toggleAnswers()" id="ans-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-4 rounded shadow transition text-sm">
            顯示解答版
        </button>
        <button onclick="window.print()" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded shadow transition text-sm">
            輸出 PDF (A4橫向)
        </button>
    </div>

    <!-- 題目容器 -->
    <div id="app">
        <div id="print-container">
            <!-- 內容由 JS 動態生成 -->
        </div>
    </div>

    <!-- 虛擬小鍵盤 (預設隱藏) -->
    <div id="keypad" class="fixed bottom-0 left-0 w-full bg-gray-200 border-t border-gray-300 shadow-[0_-4px_6px_rgba(0,0,0,0.1)] p-2 no-print z-50">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-sm font-bold text-gray-600">小鍵盤作答區</span>
                <button onclick="closeKeypad()" class="text-red-500 font-bold px-3 py-1 bg-red-100 rounded hover:bg-red-200">關閉</button>
            </div>
            <div class="grid grid-cols-5 gap-2">
                <!-- 數字鍵 -->
                <button onclick="typeChar('1')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">1</button>
                <button onclick="typeChar('2')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">2</button>
                <button onclick="typeChar('3')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">3</button>
                <button onclick="typeChar('A')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">A</button>
                <button onclick="typeChar('D')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">D</button>

                <button onclick="typeChar('4')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">4</button>
                <button onclick="typeChar('5')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">5</button>
                <button onclick="typeChar('6')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">6</button>
                <button onclick="typeChar('B')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">B</button>
                <button onclick="typeChar('E')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">E</button>

                <button onclick="typeChar('7')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">7</button>
                <button onclick="typeChar('8')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">8</button>
                <button onclick="typeChar('9')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">9</button>
                <button onclick="typeChar('C')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">C</button>
                <button onclick="typeChar('F')" class="bg-blue-100 py-3 rounded shadow font-bold text-lg hover:bg-blue-200 text-blue-700">F</button>

                <button onclick="typeChar('.')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">.</button>
                <button onclick="typeChar('0')" class="bg-white py-3 rounded shadow font-bold text-lg hover:bg-gray-50">0</button>
                <button onclick="delChar()" class="bg-yellow-100 py-3 rounded shadow font-bold text-sm hover:bg-yellow-200 text-yellow-700 col-span-3">刪除 (DEL)</button>
            </div>
        </div>
    </div>

    <script>
        // --- 幾何與題目生成邏輯 ---
        const sortEdge = (e) => e.split('').sort().join('');

        function generateProblemData(index) {
            let a1 = (150 + Math.random() * 30) * Math.PI / 180;
            let a2 = (250 + Math.random() * 40) * Math.PI / 180;
            let a3 = (10 + Math.random() * 30) * Math.PI / 180;

            let r1 = 35 + Math.random() * 10;
            let r2 = 25 + Math.random() * 10;
            let r3 = 45 + Math.random() * 10;

            let relA = { x: r1 * Math.cos(a1), y: r1 * Math.sin(a1) };
            let relB = { x: r2 * Math.cos(a2), y: r2 * Math.sin(a2) };
            let relC = { x: r3 * Math.cos(a3), y: r3 * Math.sin(a3) };

            let cx1 = 70, cy1 = 60;
            let pA = { x: cx1 + relA.x, y: cy1 + relA.y };
            let pB = { x: cx1 + relB.x, y: cy1 + relB.y };
            let pC = { x: cx1 + relC.x, y: cy1 + relC.y };

            let rot = (120 + Math.random() * 120) * Math.PI / 180;
            let rotPt = (p) => ({
                x: p.x * Math.cos(rot) - p.y * Math.sin(rot),
                y: p.x * Math.sin(rot) + p.y * Math.cos(rot)
            });

            let rA = rotPt(relA);
            let rB = rotPt(relB);
            let rC = rotPt(relC);

            let cx2 = 240, cy2 = 60;
            let pA2 = { x: cx2 + rA.x, y: cy2 + rA.y };
            let pB2 = { x: cx2 + rB.x, y: cy2 + rB.y };
            let pC2 = { x: cx2 + rC.x, y: cy2 + rC.y };

            let labels2 = ['D', 'E', 'F'];
            labels2.sort(() => Math.random() - 0.5);
            
            let M = { 'A': labels2[0], 'B': labels2[1], 'C': labels2[2] };
            let R = { [labels2[0]]: 'A', [labels2[1]]: 'B', [labels2[2]]: 'C' };

            let pts2 = {
                [labels2[0]]: { pt: pA2, rel: rA },
                [labels2[1]]: { pt: pB2, rel: rB },
                [labels2[2]]: { pt: pC2, rel: rC }
            };

            let vertices = ['A', 'B', 'C'];
            let givenAngleVertex = vertices[Math.floor(Math.random() * 3)];
            let givenAngleVal = Math.floor(Math.random() * 85) + 15; 

            let edges1 = ['AB', 'BC', 'CA'];
            let givenSide1Edge = sortEdge(edges1[Math.floor(Math.random() * 3)]);
            let givenSide1Val = (Math.random() * 6 + 3).toFixed(1); 

            let corrEdge1 = sortEdge(M[givenSide1Edge[0]] + M[givenSide1Edge[1]]);
            let edges2 = ['DE', 'EF', 'FD'].map(sortEdge);
            let validEdges2 = edges2.filter(e => e !== corrEdge1);
            let givenSide2Edge = validEdges2[Math.floor(Math.random() * validEdges2.length)];
            let givenSide2Val = (Math.random() * 6 + 2).toFixed(1); 

            let hintVertex = vertices[Math.floor(Math.random() * 3)];
            let otherVertices = vertices.filter(v => v !== hintVertex);

            let corrSide2 = sortEdge(R[givenSide2Edge[0]] + R[givenSide2Edge[1]]);
            let corrSide1 = corrEdge1;

            let q4Vertices = [...vertices].sort(() => Math.random() - 0.5).slice(0, 2);
            let q4Edge = edges2[Math.floor(Math.random() * edges2.length)]; 
            let corrQ4Edge = sortEdge(R[q4Edge[0]] + R[q4Edge[1]]); 

            return {
                index, pA, pB, pC, relA, relB, relC, cx1, cy1, cx2, cy2, pts2, M, R,
                givenAngleVertex, givenAngleVal, givenSide1Edge, givenSide1Val,
                givenSide2Edge, givenSide2Val, hintVertex, otherVertices,
                corrSide2, corrSide1, q4Vertices, q4Edge, corrQ4Edge
            };
        }

        function generateSVG(p) {
            const getLab = (pt, rel, offset = 16) => {
                let len = Math.hypot(rel.x, rel.y);
                return { x: pt.x + (rel.x / len) * offset, y: pt.y + (rel.y / len) * offset };
            };

            let lA = getLab(p.pA, p.relA);
            let lB = getLab(p.pB, p.relB);
            let lC = getLab(p.pC, p.relC);
            let lD = getLab(p.pts2['D'].pt, p.pts2['D'].rel);
            let lE = getLab(p.pts2['E'].pt, p.pts2['E'].rel);
            let lF = getLab(p.pts2['F'].pt, p.pts2['F'].rel);

            return `
            <svg viewBox="0 0 310 120" class="w-full h-full">
                <polygon points="${p.pA.x},${p.pA.y} ${p.pB.x},${p.pB.y} ${p.pC.x},${p.pC.y}" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
                <text x="${p.cx1}" y="${p.cy1}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#555">甲</text>
                <text x="${lA.x}" y="${lA.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">A</text>
                <text x="${lB.x}" y="${lB.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">B</text>
                <text x="${lC.x}" y="${lC.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">C</text>

                <polygon points="${p.pts2['D'].pt.x},${p.pts2['D'].pt.y} ${p.pts2['E'].pt.x},${p.pts2['E'].pt.y} ${p.pts2['F'].pt.x},${p.pts2['F'].pt.y}" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
                <text x="${p.cx2}" y="${p.cy2}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#555">乙</text>
                <text x="${lD.x}" y="${lD.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">D</text>
                <text x="${lE.x}" y="${lE.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">E</text>
                <text x="${lF.x}" y="${lF.y}" text-anchor="middle" dominant-baseline="middle" font-size="14">F</text>
            </svg>
            `;
        }

        // --- 網頁與互動邏輯 ---
        
        let activeInput = null;

        function buildHTML() {
            const problems = [1, 2, 3, 4].map(i => generateProblemData(i));
            let html = '';
            
            problems.forEach(p => {
                html += `
                    <div class="problem-block">
                        <div class="print-title">全等三角形(旋轉)練習題</div>
                        <div class="flex items-start text-[11pt] mb-1 leading-snug">
                            <span class="inline-block bg-slate-700 text-white rounded-full min-w-[20px] h-5 text-center leading-5 mr-2 text-sm italic font-serif flex-shrink-0 print:bg-gray-300 print:text-black">${p.index}</span>
                            <span>旋轉甲圖後，可以和乙圖完全疊合。&ang;${p.givenAngleVertex} 是 ${p.givenAngleVal}&deg;，<span class="overline">${p.givenSide1Edge}</span> 是 ${p.givenSide1Val} 公分，<span class="overline">${p.givenSide2Edge}</span> 是 ${p.givenSide2Val} 公分：</span>
                        </div>
                        
                        <div class="h-[105px] w-full print:h-[90px]">
                            ${generateSVG(p)}
                        </div>
                        
                        <div class="pl-7 space-y-1.5 text-[11pt] tracking-wide">
                            <p>1. &ang;${p.hintVertex} 的對應角是 &ang;${p.M[p.hintVertex]}，&ang;${p.otherVertices[0]} 的對應角是 (&nbsp;<span class="blank-input" data-ans="${p.M[p.otherVertices[0]]}" onclick="openKeypad(this)"></span>&nbsp;)，<br>&nbsp;&nbsp;&nbsp;&nbsp;&ang;${p.otherVertices[1]} 的對應角是 (&nbsp;<span class="blank-input" data-ans="${p.M[p.otherVertices[1]]}" onclick="openKeypad(this)"></span>&nbsp;)。</p>
                            <p>2. &ang;${p.M[p.givenAngleVertex]} 是 (&nbsp;<span class="blank-input" data-ans="${p.givenAngleVal}" onclick="openKeypad(this)"></span>&nbsp;) 度。</p>
                            <p>3. <span class="overline">${p.corrSide2}</span> 是 (&nbsp;<span class="blank-input" data-ans="${p.givenSide2Val}" onclick="openKeypad(this)"></span>&nbsp;) 公分，<span class="overline">${p.corrSide1}</span> 是 (&nbsp;<span class="blank-input" data-ans="${p.givenSide1Val}" onclick="openKeypad(this)"></span>&nbsp;) 公分。</p>
                            <p>4. 點 ${p.q4Vertices[0]} 的對應點是點 (&nbsp;<span class="blank-input" data-ans="${p.M[p.q4Vertices[0]]}" onclick="openKeypad(this)"></span>&nbsp;)，點 ${p.q4Vertices[1]} 的對應點是點<br>&nbsp;&nbsp;&nbsp;&nbsp;(&nbsp;<span class="blank-input" data-ans="${p.M[p.q4Vertices[1]]}" onclick="openKeypad(this)"></span>&nbsp;)，<span class="overline">${p.q4Edge}</span> 的對應邊是 (&nbsp;<span class="blank-input overline-ans" data-ans="${p.corrQ4Edge}" onclick="openKeypad(this)"></span>&nbsp;)。</p>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function generateAll() {
            document.getElementById('print-container').innerHTML = buildHTML();
            closeKeypad();
            
            // 如果原本在解答模式，重新出題時就關閉
            const app = document.getElementById('app');
            if(app.classList.contains('answer-mode')) {
                toggleAnswers();
            }
        }

        // 解答模式切換 (老師用)
        function toggleAnswers() {
            const app = document.getElementById('app');
            const btn = document.getElementById('ans-btn');
            
            if (app.classList.contains('answer-mode')) {
                app.classList.remove('answer-mode');
                btn.innerHTML = '顯示解答版';
                btn.classList.replace('bg-orange-500', 'bg-emerald-500');
                btn.classList.replace('hover:bg-orange-600', 'hover:bg-emerald-600');
                
                // 清空作答
                document.querySelectorAll('.blank-input').forEach(el => el.innerText = '');
            } else {
                app.classList.add('answer-mode');
                btn.innerHTML = '隱藏解答版 (回到題目)';
                btn.classList.replace('bg-emerald-500', 'bg-orange-500');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-orange-600');
                
                // 填入解答
                document.querySelectorAll('.blank-input').forEach(el => {
                    el.innerText = el.getAttribute('data-ans');
                });
                closeKeypad();
            }
        }

        // --- 小鍵盤操作 ---
        function openKeypad(element) {
            // 如果是解答模式就不開啟
            if(document.getElementById('app').classList.contains('answer-mode')) return;

            if (activeInput) {
                activeInput.classList.remove('active');
            }
            activeInput = element;
            activeInput.classList.add('active');
            document.getElementById('keypad').classList.add('show');
        }

        function closeKeypad() {
            if (activeInput) {
                activeInput.classList.remove('active');
                activeInput = null;
            }
            document.getElementById('keypad').classList.remove('show');
        }

        function typeChar(char) {
            if (activeInput) {
                // 限制最多字數避免破版
                if(activeInput.innerText.length < 5) {
                    activeInput.innerText += char;
                }
            }
        }

        function delChar() {
            if (activeInput && activeInput.innerText.length > 0) {
                activeInput.innerText = activeInput.innerText.slice(0, -1);
            }
        }

        // 點擊空白處關閉鍵盤
        document.addEventListener('click', (e) => {
            const keypad = document.getElementById('keypad');
            if (keypad.classList.contains('show')) {
                // 如果點擊的不是輸入格，也不是鍵盤本身，就關閉
                if (!e.target.classList.contains('blank-input') && !keypad.contains(e.target)) {
                    closeKeypad();
                }
            }
        });

        // 頁面載入初始化
        window.onload = () => {
            generateAll();
        };
    </script>
</body>
</html>
