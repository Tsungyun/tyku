<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量角器隨機題庫產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm; /* 嚴格限制 0.5 公分邊界 */
            }
            body {
                margin: 0;
                padding: 0;
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .a4-landscape {
                /* 297mm - 10mm邊距 = 287mm。嚴格鎖定尺寸，確保絕對不跑到第二頁 */
                width: 287mm; 
                height: 198mm; 
                padding: 0; 
                margin: 0;
                box-sizing: border-box;
                display: flex;
                flex-direction: row;
                gap: 2mm; /* 左右兩大張的中間小縫隙 */
                overflow: hidden; 
            }
            .column {
                flex: 1;
                display: grid;
                /* 使用 minmax(0, 1fr) 防止大圖把網格撐破，確保嚴格均分 */
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: repeat(4, 1fr); 
                gap: 1mm 3mm; /* 榨乾每一寸空間，間距壓到最小 */
            }
            
            /* 裁切線與內縮微調 */
            #column-left, #column-left-answer {
                border-right: 1px dashed #ccc;
                padding-right: 2mm;
            }
            #column-right, #column-right-answer {
                padding-left: 2mm;
            }

            /* 版面核心：圖片佔比微調，避免題目較長時把 7、8 題擠到下一頁 */
            .protractor-container {
                width: 100% !important; 
                max-width: 82% !important; /* 從 100% 縮小到 82%，保留垂直空間給 2-3 行的題目文字 */
                margin: 0 auto !important;
            }
            
            .question-item {
                overflow: hidden; /* 強制防止圖片或文字撐破排版導致歪斜 */
            }
            
            /* 針對獨立列印按鈕的隱藏邏輯 */
            body.print-q #print-view-answers { display: none !important; }
            body.print-a #print-view-questions { display: none !important; }
        }

        .question-item {
            display: flex;
            flex-direction: column;
            font-size: 12pt; /* 回歸標準 12pt 字型，夠清楚且節省高度 */
            line-height: 1.15; /* 縮小行距 */
        }
        
        .question-text {
            margin-bottom: 2px;
            font-family: "標楷體", "BiauKai", serif; 
        }

        /* 網頁版維持的圖片大小設定 */
        .protractor-container {
            position: relative;
            width: 100%;
            max-width: 280px; 
            margin: 0 auto;
        }

        .protractor-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .draw-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans">

    <div class="no-print max-w-5xl mx-auto mb-6 flex flex-wrap justify-center gap-4">
        <button onclick="generateQuiz()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition-transform transform hover:scale-105">
            🔄 重新產生題目
        </button>
        <button id="toggleBtn" onclick="toggleAnswers()" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded shadow transition-transform transform hover:scale-105">
            👀 切換顯示：解答卷
        </button>
        <button onclick="printDocument('question')" class="bg-green-600 hover:bg-green-800 text-white font-bold py-2 px-6 rounded shadow transition-transform transform hover:scale-105">
            🖨️️ 列印 / 存PDF (題目卷)
        </button>
        <button onclick="printDocument('answer')" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-6 rounded shadow transition-transform transform hover:scale-105">
            🖨️ 列印 / 存PDF (解答卷)
        </button>
    </div>

    <!-- 加入微調控制面板 -->
    <div class="no-print max-w-4xl mx-auto mb-6 bg-yellow-50 border border-yellow-300 p-4 rounded-lg shadow-sm flex flex-col items-center gap-3">
        <div class="text-gray-800 font-bold">🔧 黑線起點對準校正面板</div>
        <div class="text-sm text-gray-600 mb-1">若發現黑線起點沒有精準對準量角器十字，或線指到的刻度不是 5 的倍數，請拖拉下方滑桿微調：</div>
        <div class="flex flex-wrap justify-center gap-8">
            <label class="flex items-center gap-2 font-semibold">
                左右平移 (X軸):
                <input type="range" id="sliderX" min="400" max="600" value="500" class="w-32 cursor-pointer">
            </label>
            <label class="flex items-center gap-2 font-semibold">
                上下平移 (Y軸):
                <input type="range" id="sliderY" min="700" max="1000" value="840" class="w-32 cursor-pointer">
            </label>
        </div>
    </div>

    <!-- 網頁顯示用的容器 (網格佈局，2欄4列) -->
    <div id="web-view" class="no-print max-w-5xl mx-auto bg-white p-8 rounded shadow mb-8">
        <div class="font-bold text-2xl mb-4 question-text text-center border-b-2 pb-2 text-blue-800">📝 量角器隨堂測驗 - 題目卷</div>
        <div id="web-grid" class="grid grid-cols-2 gap-x-8 gap-y-6">
            <!-- 網頁版的 8 題會插在這裡 -->
        </div>
    </div>

    <!-- 加入 hidden 預設隱藏解答卷 -->
    <div id="web-answer-view" class="no-print max-w-5xl mx-auto bg-green-50 p-8 rounded shadow mb-8 border border-green-200 hidden">
        <div class="font-bold text-2xl mb-4 question-text text-center border-b-2 pb-2 text-green-800">💡 測驗解答卷</div>
        <div id="web-grid-answers" class="grid grid-cols-2 gap-x-8 gap-y-6">
            <!-- 網頁版的 8 題解答會插在這裡 -->
        </div>
    </div>

    <!-- 列印專用的 A4 容器 - 題目卷 (移除了預設的 page-break，由列印邏輯控制) -->
    <div id="print-view-questions" class="a4-landscape hidden print:flex">
        <div id="column-left" class="column">
            <!-- 題目會動態插入這裡 -->
        </div>
        
        <!-- 右欄 (與左欄內容相同) -->
        <div id="column-right" class="column">
             <!-- 題目會動態插入這裡 -->
        </div>
    </div>

    <!-- 列印專用的 A4 容器 - 解答卷 -->
    <div id="print-view-answers" class="a4-landscape hidden print:flex">
        <!-- 左欄 -->
        <div id="column-left-answer" class="column bg-gray-50">
            <!-- 題目會動態插入這裡 -->
        </div>
        
        <!-- 右欄 (與左欄內容相同) -->
        <div id="column-right-answer" class="column bg-gray-50">
             <!-- 題目會動態插入這裡 -->
        </div>
    </div>

<!-- 專屬版權宣告頁尾 (乾淨、單行設計) -->
    <div class="text-center text-gray-400 text-sm mt-8 mb-4 tracking-wider">
        &copy; 谷宗芸老師設計 / AI 輔助生成
    </div>


    <script>
        // 量角器圖片路徑 (需確保與 html 同目錄或調整路徑)
        const PROTRACTOR_IMG_SRC = '量角器_2.png';
        const NUM_QUESTIONS = 8; // 每欄 8 題
        let protractorImage = null; // 全域變數儲存圖片物件
        let currentQuizData = []; // 儲存目前的題目資料，以便微調時不需重新出題

        // 中心點校正比例，預設值
        let centerOffsetX = 0.500;
        let centerOffsetY = 0.840; 

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        // 輔助函數：取得範圍內的隨機整數 (包含 min, 包含 max)，絕對保證是 5 的倍數
        function getRandomAngle(min, max) {
            // 先將 min 和 max 縮小到 5 的倍數範圍，利用整數運算確保結果
            const min5 = Math.ceil(min / 5);
            const max5 = Math.floor(max / 5);
            // 在這個範圍內隨機取整數後，再乘以 5
            const randomMul = Math.floor(Math.random() * (max5 - min5 + 1)) + min5;
            return randomMul * 5;
        }

        // 輔助函數：取得量角器的繪圖幾何參數 (中心點、半徑)
        function getProtractorGeometry(canvas) {
            return {
                cx: canvas.width * centerOffsetX,
                cy: canvas.height * centerOffsetY, 
                r: canvas.width * 0.44
            };
        }

        // 輔助函數：在 canvas 上畫線
        // angle: 0-180度 (0度在右, 180度在左)
        function drawLineOnCanvas(ctx, centerX, centerY, radius, angleDeg, color = 'black', lineWidth = 6) {
            const angleRad = angleDeg * Math.PI / 180;
            const endX = centerX + radius * Math.cos(angleRad);
            const endY = centerY - radius * Math.sin(angleRad); // canvas Y軸向下

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth; // 加粗線條 (改為6)
            ctx.lineCap = 'round';     // 讓線條端點圓滑
            ctx.stroke();
            
            // 為了更明確指出起點，在中心點畫一個圓點
            if (color === 'black') {
                ctx.beginPath();
                ctx.arc(centerX, centerY, lineWidth * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }

            return {x: endX, y: endY};
        }

        // 輔助函數：畫圓弧箭頭 (表示旋轉方向)
        function drawArrowArc(ctx, centerX, centerY, radius, startAngleDeg, endAngleDeg, isClockwise) {
            const startAngleRad = -startAngleDeg * Math.PI / 180; // canvas Y軸反向，所以角度加負號
            const endAngleRad = -endAngleDeg * Math.PI / 180;
            
            ctx.beginPath();
            // 注意 arc 的參數： arc(x, y, radius, startAngle, endAngle, counterclockwise)
            // 在 canvas 中，0度在右邊(3點鐘)，順時針是正向。
            // 我們習慣的量角器0度在右，逆時針是增加。
            // 所以為了配合我們輸入的 0~180 度，轉換過後，
            // 順時針旋轉 (角度減少) -> isClockwise = true (canvas 的 counterclockwise = false)
            // 逆時針旋轉 (角度增加) -> isClockwise = false (canvas 的 counterclockwise = true)
            ctx.arc(centerX, centerY, radius, startAngleRad, endAngleRad, !isClockwise);
            ctx.strokeStyle = 'red'; // 用紅色標示旋轉
            ctx.lineWidth = 2.5;     // 箭頭線條加粗
            ctx.stroke();

            // 畫箭頭頭部
            const headlen = 10; // 箭頭長度加長
            const endX = centerX + radius * Math.cos(endAngleRad);
            const endY = centerY + radius * Math.sin(endAngleRad);
            
            // 計算箭頭方向
            let angle = endAngleRad;
            if (isClockwise) {
                angle += Math.PI / 2; // 切線方向
            } else {
                angle -= Math.PI / 2;
            }

            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        // 產生第 1 種類型題目：兩個相鄰的角
        function generateType1() {
            // 內圈刻度：右邊0，左邊180
            const angle1 = getRandomAngle(20, 70); // 第一個線的角度 (從右邊算起)
            const angle2 = getRandomAngle(angle1 + 30, 160); // 第二個線的角度
            const angle3 = getRandomAngle(angle2 + 20, 180); // 第三個線的角度

            // 題目是問中間兩個角
            const a1 = angle2 - angle1;
            const a2 = angle3 - angle2;

            const text = `圖中的 ∠1 和 ∠2 合起來是幾度？相差幾度？`;
            const answerText = `合起來：${a1 + a2}度，相差：${Math.abs(a1 - a2)}度`;
            
            const drawQuestion = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);

                drawLineOnCanvas(ctx, cx, cy, r, angle1);
                drawLineOnCanvas(ctx, cx, cy, r, angle2);
                drawLineOnCanvas(ctx, cx, cy, r, angle3);

                // 標示 ∠1, ∠2 - 再度放大字體，確保圖片縮小列印後依然清晰
                ctx.font = 'bold 44px Arial'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const midAngle1 = angle1 + a1 / 2;
                const midAngle2 = angle2 + a2 / 2;
                const textR = r * 0.55; // 將文字稍微往外推一點避免太擠
                
                const x1 = cx + textR * Math.cos(midAngle1 * Math.PI/180);
                const y1 = cy - textR * Math.sin(midAngle1 * Math.PI/180);
                const x2 = cx + textR * Math.cos(midAngle2 * Math.PI/180);
                const y2 = cy - textR * Math.sin(midAngle2 * Math.PI/180);
                
                // 畫出白色外框增加辨識度
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'white';
                ctx.strokeText('1', x1, y1);
                ctx.strokeText('2', x2, y2);
                
                // 畫出黑色主字體
                ctx.fillStyle = 'black';
                ctx.fillText('1', x1, y1);
                ctx.fillText('2', x2, y2);
                
                // 畫弧線
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy, r*0.35, -angle1*Math.PI/180, -angle2*Math.PI/180, true);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, r*0.40, -angle2*Math.PI/180, -angle3*Math.PI/180, true);
                ctx.stroke();
            };

            const drawAnswer = (canvas) => {
                drawQuestion(canvas); // 繼承題目的圖
            };

            return { text, answerText, drawQuestion, drawAnswer };
        }

        // 產生第 2 種類型題目：內圈，先逆再順
        function generateType2() {
            // 內圈 0 在右邊
            const startAngle = 0;
            const turn1 = getRandomAngle(100, 160); // 逆時針轉 (角度增加)
            const currentAngle = startAngle + turn1;
            const turn2 = getRandomAngle(30, currentAngle - 20); // 順時針轉 (角度減少)
            
            const text = `黑線從內圈刻度 0 度開始，先逆時針方向旋轉 ${turn1} 度後，再順時針方向旋轉 ${turn2} 度，黑線會停在內圈刻度幾度的位置？`;
            const finalAngle = currentAngle - turn2;
            const answerText = `停在內圈刻度 ${finalAngle} 度的位置`;
            
            const drawQuestion = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 題目圖：只畫出「旋轉後」的第一個中繼位置，不畫答案
                drawLineOnCanvas(ctx, cx, cy, r, currentAngle);
            };

            const drawAnswer = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 解答圖：畫出過程與最終答案
                drawLineOnCanvas(ctx, cx, cy, r, currentAngle, 'rgba(0,0,0,0.3)', 4); // 舊位置半透明
                drawLineOnCanvas(ctx, cx, cy, r, finalAngle, 'blue', 6); // 答案位置用藍色
                
                drawArrowArc(ctx, cx, cy, r*0.5, startAngle, currentAngle, false); // 逆時針過程
                drawArrowArc(ctx, cx, cy, r*0.65, currentAngle, finalAngle, true);  // 順時針答案過程
            };
            return { text, answerText, drawQuestion, drawAnswer };
        }

        // 產生第 3 種類型題目：外圈，先順再順
        function generateType3() {
            // 外圈 0 在左邊 (即內圈 180 度)
            const startAngle_inner = 180; 
            const turn1 = getRandomAngle(40, 80); // 順時針 (內圈角度減少)
            const currentAngle_inner = startAngle_inner - turn1;
            const turn2 = getRandomAngle(40, currentAngle_inner - 10); // 繼續順時針
            
            const text = `黑線從外圈刻度 0 度開始，先順時針方向旋轉 ${turn1} 度後，再順時針方向旋轉 ${turn2} 度，黑線會停在外圈刻度幾度的位置？`;
            
            const finalAngle_inner = currentAngle_inner - turn2;
            const finalAngle_outer = 180 - finalAngle_inner;
            const answerText = `停在外圈刻度 ${finalAngle_outer} 度的位置`;
            
            const drawQuestion = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 題目圖：只畫出第一個中繼位置
                drawLineOnCanvas(ctx, cx, cy, r, currentAngle_inner);
            };

            const drawAnswer = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 解答圖
                drawLineOnCanvas(ctx, cx, cy, r, currentAngle_inner, 'rgba(0,0,0,0.3)', 4);
                drawLineOnCanvas(ctx, cx, cy, r, finalAngle_inner, 'blue', 6);

                drawArrowArc(ctx, cx, cy, r*0.5, startAngle_inner, currentAngle_inner, true);
                drawArrowArc(ctx, cx, cy, r*0.65, currentAngle_inner, finalAngle_inner, true);
            };
            return { text, answerText, drawQuestion, drawAnswer };
        }

        // 產生第 4 種類型題目：外圈，求中間轉了幾度
        function generateType4() {
             // 外圈 0 在左邊 (即內圈 180 度)
            const startOuter = getRandomAngle(20, 60);
            const startInner = 180 - startOuter;
            const endOuter = getRandomAngle(130, 170);
            const endInner = 180 - endOuter;
            
            const text = `黑線從外圈刻度 ${startOuter} 度開始，順時針方向旋轉幾度，會停在外圈刻度 ${endOuter} 度的位置？`;
            const answerText = `順時針旋轉 ${endOuter - startOuter} 度`;
            
            const drawQuestion = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 題目圖：只畫出起點和終點
                drawLineOnCanvas(ctx, cx, cy, r, startInner); 
                drawLineOnCanvas(ctx, cx, cy, r, endInner); 
            };

            const drawAnswer = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                drawQuestion(canvas);
                // 解答圖：畫出箭頭表示旋轉
                drawArrowArc(ctx, cx, cy, r*0.6, startInner, endInner, true);
            };

            return { text, answerText, drawQuestion, drawAnswer };
        }

        // 產生第 5 種類型題目：內圈，先逆再順，求中間順了幾度
        function generateType5() {
            // 內圈 0 在右邊
            const turn1 = getRandomAngle(110, 160); // 先逆時針轉到
            const finalAngle = getRandomAngle(40, 90);  // 最後停在
            
            const text = `黑線從內圈刻度 0 度開始，先往逆時針方向旋轉到 ${turn1} 度，再順時針方向旋轉幾度，最後會停在 ${finalAngle} 度的位置？`;
            const answerText = `順時針旋轉 ${turn1 - finalAngle} 度`;
            
            const drawQuestion = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                // 題目圖：只畫出轉到的位置和最後停的位置 (沒有箭頭)
                drawLineOnCanvas(ctx, cx, cy, r, turn1);
                drawLineOnCanvas(ctx, cx, cy, r, finalAngle);
            };

            const drawAnswer = (canvas) => {
                const ctx = canvas.getContext('2d');
                const { cx, cy, r } = getProtractorGeometry(canvas);
                
                drawQuestion(canvas);
                // 解答圖：畫出推導的箭頭
                drawArrowArc(ctx, cx, cy, r*0.45, 0, turn1, false); // 第一步逆時針
                drawArrowArc(ctx, cx, cy, r*0.65, turn1, finalAngle, true); // 答案：第二步順時針
            };

            return { text, answerText, drawQuestion, drawAnswer };
        }

        // 產生一整份試卷的資料
        function generateQuizData() {
            const questions = [];
            // 每欄 8 題，我們循環使用這 5 種題型，確保多樣性
            const generators = [generateType1, generateType2, generateType3, generateType4, generateType5];
            
            for (let i = 0; i < NUM_QUESTIONS; i++) {
                // 依序輪流使用題型產生器，確保 5 種題型都有，剩下的隨機
                const genFunc = generators[i % generators.length];
                questions.push(genFunc());
            }
            return questions;
        }

        // 產生單一題目的 DOM 元素 (mode: 'question' 或是 'answer')
        function createQuestionElement(q, index, mode = 'question') {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'question-item';
            
            const qNum = index + 1;
            const textDiv = document.createElement('div');
            
            if (mode === 'question') {
                textDiv.className = 'question-text font-semibold';
                textDiv.innerHTML = `${qNum}. ${q.text}`;
            } else {
                textDiv.className = 'question-text font-semibold text-green-700';
                textDiv.innerHTML = `${qNum}. [解答] ${q.answerText}`;
            }
            
            const imgContainer = document.createElement('div');
            imgContainer.className = 'protractor-container mt-2';
            
            // 使用預先載入好的圖片
            const img = document.createElement('img');
            img.src = protractorImage.src;
            img.className = 'protractor-img opacity-90'; // 稍微讓量角器透一點，凸顯線條
            
            const canvas = document.createElement('canvas');
            canvas.className = 'draw-layer';
            // 根據真實圖片大小設定 canvas 解析度
            canvas.width = protractorImage.width;
            canvas.height = protractorImage.height;
            
            // 根據模式呼叫對應的繪圖函數
            if (mode === 'question') {
                q.drawQuestion(canvas);
            } else {
                q.drawAnswer(canvas);
            }

            imgContainer.appendChild(img);
            imgContainer.appendChild(canvas);
            
            itemDiv.appendChild(textDiv);
            itemDiv.appendChild(imgContainer);
            
            return itemDiv;
        }

        // 渲染指定的容器
        function renderQuestionsToContainer(containerId, questions, mode, addHeader = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // 清空

            if (addHeader) {
                const header = document.createElement('div');
                // 縮小標題：字體改為 text-base，邊距改為 mb-1
                header.className = `font-bold text-base mb-1 question-text ${mode === 'answer' ? 'text-green-800' : ''}`;
                header.style.gridColumn = '1 / -1'; // 確保在 Grid 排版下標題橫跨左右兩欄
                if (mode === 'question') {
                    // 移除計分等資訊，單純顯示標題
                    header.innerHTML = `量角器隨堂測驗`; 
                } else {
                    header.innerHTML = `【解答卷】`;
                }
                container.appendChild(header);
            }

            questions.forEach((q, index) => {
                const qElem = createQuestionElement(q, index, mode);
                container.appendChild(qElem);
            });
        }

        async function generateQuiz() {
            // 確保圖片已經載入
            if (!protractorImage) {
                try {
                    protractorImage = await preloadImage(PROTRACTOR_IMG_SRC);
                } catch (e) {
                    alert('無法載入量角器圖片，請確認圖片路徑。');
                    return;
                }
            }

            // 產生 8 題的資料並儲存為全域變數，避免微調位置時題目跑掉
            currentQuizData = generateQuizData();
            renderQuiz();
        }

        function renderQuiz() {
            if(currentQuizData.length === 0) return;

            // 1. 渲染網頁視圖 - 題目卷 (帶有標題)
            renderQuestionsToContainer('web-grid', currentQuizData, 'question', true);
            // 渲染網頁視圖 - 解答卷 (帶有標題)
            renderQuestionsToContainer('web-grid-answers', currentQuizData, 'answer', true);

            // 2. 渲染列印視圖 - 題目卷 (左右兩欄完全一樣，為節省空間，關閉標題)
            const printViewQuestions = document.getElementById('print-view-questions');
            printViewQuestions.classList.remove('hidden');
            printViewQuestions.classList.add('print:flex');
            renderQuestionsToContainer('column-left', currentQuizData, 'question', false);
            renderQuestionsToContainer('column-right', currentQuizData, 'question', false);

            // 3. 渲染列印視圖 - 解答卷 (左右兩欄完全一樣，為節省空間，關閉標題)
            const printViewAnswers = document.getElementById('print-view-answers');
            printViewAnswers.classList.remove('hidden');
            printViewAnswers.classList.add('print:flex');
            renderQuestionsToContainer('column-left-answer', currentQuizData, 'answer', false);
            renderQuestionsToContainer('column-right-answer', currentQuizData, 'answer', false);
        }

        // --- 新增：切換網頁顯示題目卷或解答卷 ---
        let showingAnswers = false;
        function toggleAnswers() {
            showingAnswers = !showingAnswers;
            const btn = document.getElementById('toggleBtn');
            if (showingAnswers) {
                document.getElementById('web-view').classList.add('hidden');
                document.getElementById('web-answer-view').classList.remove('hidden');
                btn.innerHTML = '📝 切換顯示：題目卷';
                btn.classList.replace('bg-purple-500', 'bg-orange-500');
                btn.classList.replace('hover:bg-purple-700', 'hover:bg-orange-700');
            } else {
                document.getElementById('web-view').classList.remove('hidden');
                document.getElementById('web-answer-view').classList.add('hidden');
                btn.innerHTML = '👀 切換顯示：解答卷';
                btn.classList.replace('bg-orange-500', 'bg-purple-500');
                btn.classList.replace('hover:bg-orange-700', 'hover:bg-purple-700');
            }
        }

        // --- 新增：分開列印題目與解答 ---
        function printDocument(type) {
            // 在 body 加上對應的 class，讓 CSS 控制隱藏不相關的區塊
            if (type === 'question') {
                document.body.classList.add('print-q');
                window.print();
                document.body.classList.remove('print-q');
            } else {
                document.body.classList.add('print-a');
                window.print();
                document.body.classList.remove('print-a');
            }
        }

        // 頁面載入完成後立即產生一次題目
        window.onload = () => {
            // 綁定校正滑桿事件 (滑動時只重繪，不出新題)
            document.getElementById('sliderX').addEventListener('input', function(e) {
                centerOffsetX = e.target.value / 1000;
                renderQuiz(); 
            });
            document.getElementById('sliderY').addEventListener('input', function(e) {
                centerOffsetY = e.target.value / 1000;
                renderQuiz(); 
            });

            // CSS 處理列印時隱藏/顯示的邏輯
            const style = document.createElement('style');
            style.innerHTML = `
                @media print {
                    .no-print { display: none !important; }
                    .hidden.print\\:flex { display: flex !important; }
                    #web-view, #web-answer-view { display: none !important; }
                }
                @media screen {
                    .print\\:flex { display: none; }
                    #print-view-questions.hidden, #print-view-answers.hidden { display: none; }
                }
            `;
            document.head.appendChild(style);
            
            generateQuiz();
        };

    </script>
</body>
